          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>min</span>
        </div>
        <button onClick={save} style={primaryBtn} disabled={!subjectId || !link.trim()}>{saved ? "Salvo ✓" : "Salvar aula"}</button>
      </div>
    </Card>
  );
}

// ---------- Sessões ----------
function Sessoes({ subjects, sessions }) {
  const grouped = useMemo(() => {
    const map = {};
    sessions.forEach((s) => {
      const day = new Date(s.endedAt).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" });
      map[day] = map[day] || [];
      map[day].push(s);
    });
    return map;
  }, [sessions]);

  if (sessions.length === 0) return <Card><EmptyRow text="Nenhuma sessão registrada ainda. Use o cronômetro para começar." /></Card>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {Object.entries(grouped).map(([day, list]) => (
        <div key={day}>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6, textTransform: "capitalize" }}>{day}</div>
          <Card style={{ padding: 4 }}>
            {list.map((s, i) => {
              const subj = subjects.find((x) => x.id === s.subjectId);
              return (
                <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: i < list.length - 1 ? "1px solid var(--line)" : "none" }}>
                  <SubjectMark subject={subj} size={10} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14 }}>{s.mode === "video" ? "🎥 " : ""}{subj?.name || "Matéria removida"}</div>
                    {s.note && <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 1 }}>{s.note}</div>}
                    {s.link && <a href={s.link} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11.5, color: "var(--accent2)" }}>Abrir vídeo ↗</a>}
                  </div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>{fmtDuration(s.seconds)}</div>
                </div>
              );
            })}
          </Card>
        </div>
      ))}
    </div>
  );
}

// ---------- Importer (com upload de PDF) ----------
const QUESTIONS_JSON_EXAMPLE = `{
  "questoes": [
    {
      "materia": "Matemática",
      "banca": "ITA 2025",
      "enunciado": "Texto da questão...",
      "alternativas": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." },
      "gabarito": "C"
    },
    {
      "materia": "Física",
      "banca": "ITA 2025",
      "enunciado": "...",
      "alternativas": { "A": "...", "B": "...", "C": "...", "D": "..." },
      "gabarito": "A"
    }
  ]
}`;

function Importer({ subjects, setSubjects, setQuestions, setTab, savedExams, setSavedExams }) {
  const [source, setSource] = useState("");
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [examText, setExamText] = useState("");
  const [keyText, setKeyText] = useState("");
  const [examPdfDataUrl, setExamPdfDataUrl] = useState(null);
  const [keyPdfDataUrl, setKeyPdfDataUrl] = useState(null);
  const [preview, setPreview] = useState(null);
  const [loadingExam, setLoadingExam] = useState(false);
  const [loadingKey, setLoadingKey] = useState(false);
  const [fileError, setFileError] = useState("");
  const [showRaw, setShowRaw] = useState(false);
  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");
  const [rangeSubject, setRangeSubject] = useState(subjects[0]?.id || "");
  const [rangeTopic, setRangeTopic] = useState("");
  const examFileRef = useRef(null);
  const keyFileRef = useRef(null);

  const [jsonText, setJsonText] = useState("");
  const [jsonMsg, setJsonMsg] = useState("");
  const [showJsonFormat, setShowJsonFormat] = useState(false);
  const [jsonPreview, setJsonPreview] = useState(null); // { materias: [{ jsonName, mappedSubjectId, isNew, color, icon }], questions: [...] }
  // Preview para importação PDF (com mapeamento de matérias igual ao JSON)
  const [pdfPreview, setPdfPreview] = useState(null);

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleExamFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setLoadingExam(true);
    try {
      const text = await extractAnyText(file);
      setExamText(text);
      // PDFs muito grandes estouram o localStorage — nesse caso importa as questões
      // mas não guarda o PDF para visualização
      if (file.size > 2.5 * 1024 * 1024) {
        setExamPdfDataUrl(null);
        setFileError("PDF da prova muito grande (+2,5MB): vou importar as questões, mas sem salvar o PDF para visualização.");
      } else {
        const dataUrl = await readFileAsDataUrl(file);
        setExamPdfDataUrl(dataUrl);
      }
      if (!source.trim()) setSource(file.name.replace(/\.(pdf|txt)$/i, ""));
    } catch (err) {
      setFileError("Não consegui ler esse arquivo. Tente colar o texto manualmente.");
    } finally {
      setLoadingExam(false);
      e.target.value = "";
    }
  }

  async function handleKeyFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setLoadingKey(true);
    try {
      const text = await extractAnyText(file);
      setKeyText(text);
      if (file.size > 2.5 * 1024 * 1024) {
        setKeyPdfDataUrl(null);
      } else {
        const dataUrl = await readFileAsDataUrl(file);
        setKeyPdfDataUrl(dataUrl);
      }
    } catch (err) {
      setFileError("Não consegui ler o gabarito. Tente colar o texto manualmente.");
    } finally {
      setLoadingKey(false);
      e.target.value = "";
    }
  }

  function buildPdfPreview(parsedQuestions, answerMap) {
    let currentSubjects = subjects;
    const materiaMap = {};
    const questions = [];

    // Agrupa questões por matéria baseada no subjectId inicial (todas começam com o mesmo)
    // O usuário vai poder mapear intervalos depois
    parsedQuestions.forEach((q) => {
      if (!q.hasAlts) return; // só questões com alternativas reconhecidas
      const num = q.num;
      const answer = answerMap[num] || null;
      
      // Para PDF, inicialmente todas vão para uma "matéria genérica" baseada no source
      // O usuário vai atribuir matérias por intervalo
      const jsonName = source.trim() || "Prova importada";
      
      if (!materiaMap[jsonName]) {
        const existing = currentSubjects.find((s) => s.name.toLowerCase() === jsonName.toLowerCase());
        if (existing) {
          materiaMap[jsonName] = { mappedSubjectId: existing.id, isNew: false, color: existing.color, icon: existing.icon };
        } else {
          const newId = uid();
          const color = PALETTE[currentSubjects.length % PALETTE.length];
          materiaMap[jsonName] = { mappedSubjectId: newId, isNew: true, color, icon: null };
          currentSubjects = [...currentSubjects, { id: newId, name: jsonName, color, icon: null }];
        }
      }

      const alts = q.alternatives;
      questions.push({
        num,
        jsonName,
        subjectId: materiaMap[jsonName].mappedSubjectId,
        source: source.trim() || "Sem título",
        topic: "",
        statement: q.statement,
        alternatives: alts,
        answer,
        altCount: Object.keys(alts).length,
        hasAlts: Object.keys(alts).length >= 2,
        difficulty: null, userAnswer: null, correct: null, attempts: 0, errors: 0,
      });
    });

    return { materias: materiaMap, questions, allSubjects: currentSubjects };
  }

  function runParse() {
    const parsedQuestions = parseExamText(examText);
    const answerMap = parseAnswerKey(keyText);
    const preview = buildPdfPreview(parsedQuestions, answerMap);
    setPdfPreview(preview);
    setShowRaw(preview.questions.length === 0);
  }

  function applyRangeSubject() {
    const from = parseInt(rangeFrom, 10);
    const to = parseInt(rangeTo, 10);
    if (!pdfPreview || isNaN(from) || isNaN(to) || !rangeSubject) return;
    const topic = rangeTopic.trim();
    setPdfPreview((prev) => {
      if (!prev) return null;
      const updatedQuestions = prev.questions.map((q) =>
        q.num >= from && q.num <= to ? { ...q, subjectId: rangeSubject, ...(topic ? { topic } : {}) } : q
      );
      return { ...prev, questions: updatedQuestions };
    });
    setRangeTopic("");
  }

  function updatePdfMapping(jsonName, newSubjectId) {
    if (newSubjectId === "__new__") {
      createNewSubjectForPdf(jsonName);
      return;
    }
    setPdfPreview((prev) => {
      if (!prev) return null;
      const { materias, questions, allSubjects } = prev;
      const updatedMaterias = { ...materias };
      updatedMaterias[jsonName] = { ...updatedMaterias[jsonName], mappedSubjectId: newSubjectId, isNew: false };
      const updatedQuestions = questions.map((q) =>
        q.jsonName === jsonName ? { ...q, subjectId: newSubjectId } : q
      );
      return { materias: updatedMaterias, questions: updatedQuestions, allSubjects };
    });
  }

  function createNewSubjectForPdf(jsonName) {
    setPdfPreview((prev) => {
      if (!prev) return null;
      const { materias, questions, allSubjects } = prev;
      const newId = uid();
      const color = PALETTE[allSubjects.length % PALETTE.length];
      const newSubject = { id: newId, name: jsonName, color, icon: null };
      const updatedMaterias = { ...materias };
      updatedMaterias[jsonName] = { mappedSubjectId: newId, isNew: true, color, icon: null };
      const updatedQuestions = questions.map((q) =>
        q.jsonName === jsonName ? { ...q, subjectId: newId } : q
      );
      return { materias: updatedMaterias, questions: updatedQuestions, allSubjects: [...allSubjects, newSubject] };
    });
  }

  function applyPdfPreview(preview) {
    if (!preview) return 0;
    const { materias, questions, allSubjects } = preview;
    setSubjects(allSubjects);
    const toAdd = questions.map((q) => ({
      id: uid(),
      source: q.source,
      subjectId: q.subjectId,
      topic: q.topic,
      statement: q.statement,
      alternatives: q.alternatives,
      answer: q.answer,
      difficulty: null, userAnswer: null, correct: null, attempts: 0, errors: 0,
    }));
    setQuestions((prev) => [...toAdd, ...prev]);
    return toAdd.length;
  }

  function confirmPdfPreview() {
    if (!pdfPreview) return;
    const count = applyPdfPreview(pdfPreview);
    
    // Salva a prova completa com PDFs
    const examRecord = {
      id: uid(),
      title: source.trim() || "Prova importada",
      date: new Date().toISOString().slice(0, 10),
      examPdfDataUrl,
      keyPdfDataUrl,
      questionCount: count,
      annotations: [], // para desenhos/balões de texto
    };
    setSavedExams((prev) => [examRecord, ...prev]);
    
    setExamText(""); setKeyText(""); setExamPdfDataUrl(null); setKeyPdfDataUrl(null);
    setPdfPreview(null); setSource("");
    setTab("provas");
    return count;
  }

  function cancelPdfPreview() {
    setPdfPreview(null);
    setExamText(""); setKeyText(""); setExamPdfDataUrl(null); setKeyPdfDataUrl(null);
    setSource("");
  }

  function confirmImport() {
    if (!pdfPreview) return;
    const count = confirmPdfPreview();
    // confirmPdfPreview já faz tudo: adiciona questões, salva prova, limpa estado, muda aba
  }

  function buildJsonPreview(data) {
    if (!data || !Array.isArray(data.questoes)) throw new Error("formato inválido");
    let currentSubjects = subjects;
    const materiaMap = {}; // jsonName -> { mappedSubjectId, isNew, color, icon }
    const questions = [];

    data.questoes.forEach((q) => {
      if (!q || !q.materia || !q.enunciado) return;
      const jsonName = String(q.materia).trim();

      if (!materiaMap[jsonName]) {
        // tenta achar matéria existente com match exato (case-insensitive)
        const existing = currentSubjects.find((s) => s.name.toLowerCase() === jsonName.toLowerCase());
        if (existing) {
          materiaMap[jsonName] = { mappedSubjectId: existing.id, isNew: false, color: existing.color, icon: existing.icon };
        } else {
          // nova matéria sugerida
          const newId = uid();
          const color = PALETTE[currentSubjects.length % PALETTE.length];
          materiaMap[jsonName] = { mappedSubjectId: newId, isNew: true, color, icon: null };
          currentSubjects = [...currentSubjects, { id: newId, name: jsonName, color, icon: null }];
        }
      }

      const alts = {};
      if (q.alternativas && typeof q.alternativas === "object") {
        Object.entries(q.alternativas).forEach(([k, v]) => { alts[k.toUpperCase()] = String(v); });
      }
      questions.push({
        jsonName,
        subjectId: materiaMap[jsonName].mappedSubjectId,
        source: (q.banca || "IA").trim(),
        topic: "",
        statement: String(q.enunciado).trim(),
        alternatives: alts,
        answer: q.gabarito ? String(q.gabarito).toUpperCase().trim() : null,
        difficulty: null, userAnswer: null, correct: null, attempts: 0, errors: 0,
      });
    });

    return { materias: materiaMap, questions, allSubjects: currentSubjects };
  }

  function applyJsonPreview(preview) {
    if (!preview) return 0;
    const { materias, questions, allSubjects } = preview;
    setSubjects(allSubjects);
    const toAdd = questions.map((q) => ({
      id: uid(),
      source: q.source,
      subjectId: q.subjectId,
      topic: q.topic,
      statement: q.statement,
      alternatives: q.alternatives,
      answer: q.answer,
      difficulty: null, userAnswer: null, correct: null, attempts: 0, errors: 0,
    }));
    setQuestions((prev) => [...toAdd, ...prev]);
    setJsonPreview(null);
    setJsonText("");
    return toAdd.length;
  }

  function importJsonPasted() {
    try {
      const data = JSON.parse(jsonText);
      const preview = buildJsonPreview(data);
      setJsonPreview(preview);
      setJsonMsg(`${preview.questions.length} questão(ões) encontradas — confira o mapeamento de matérias abaixo.`);
    } catch (e) {
      setJsonMsg("JSON inválido — confira o formato esperado abaixo.");
    }
  }

  async function importJsonFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const preview = buildJsonPreview(data);
      setJsonPreview(preview);
      setJsonMsg(`${preview.questions.length} questão(ões) encontradas — confira o mapeamento de matérias abaixo.`);
    } catch (err) {
      setJsonMsg("Não consegui ler esse arquivo JSON.");
    }
    e.target.value = "";
  }

  function confirmJsonPreview() {
    if (!jsonPreview) return;
    const count = applyJsonPreview(jsonPreview);
    setJsonMsg(`${count} questão(ões) importada(s) com sucesso.`);
  }

  function cancelJsonPreview() {
    setJsonPreview(null);
    setJsonMsg("");
  }

  function updateJsonMapping(jsonName, newSubjectId) {
    if (newSubjectId === "__new__") {
      createNewSubjectForJson(jsonName);
      return;
    }
    setJsonPreview((prev) => {
      if (!prev) return null;
      const { materias, questions, allSubjects } = prev;
      const updatedMaterias = { ...materias };
      updatedMaterias[jsonName] = { ...updatedMaterias[jsonName], mappedSubjectId: newSubjectId, isNew: false };
      // remapear questions
      const updatedQuestions = questions.map((q) =>
        q.jsonName === jsonName ? { ...q, subjectId: newSubjectId } : q
      );
      return { materias: updatedMaterias, questions: updatedQuestions, allSubjects };
    });
  }

  function createNewSubjectForJson(jsonName) {
    setJsonPreview((prev) => {
      if (!prev) return null;
      const { materias, questions, allSubjects } = prev;
      const newId = uid();
      const color = PALETTE[allSubjects.length % PALETTE.length];
      const newSubject = { id: newId, name: jsonName, color, icon: null };
      const updatedMaterias = { ...materias };
      updatedMaterias[jsonName] = { mappedSubjectId: newId, isNew: true, color, icon: null };
      const updatedQuestions = questions.map((q) =>
        q.jsonName === jsonName ? { ...q, subjectId: newId } : q
      );
      return { materias: updatedMaterias, questions: updatedQuestions, allSubjects: [...allSubjects, newSubject] };
    });
  }

  function copyJsonFormat() {
    if (navigator.clipboard) navigator.clipboard.writeText(QUESTIONS_JSON_EXAMPLE);
  }

  const okCount = preview ? preview.filter((q) => q.hasAlts).length : 0;
  const withAnswerCount = preview ? preview.filter((q) => q.hasAlts && q.answer).length : 0;
  const subjectsUsed = preview ? [...new Set(preview.map((q) => q.subjectId))].map((id) => subjects.find((s) => s.id === id)).filter(Boolean) : [];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar prova</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 12, lineHeight: 1.5 }}>
          Suba o PDF da prova e o do gabarito (ou cole o texto direto). O sistema extrai o texto do PDF no seu
          próprio navegador — nada é enviado a um servidor — e estrutura as questões automaticamente. Prova com
          mais de uma matéria (ou dividida em dias)? Analise primeiro e ajuste a matéria por intervalo de
          questão na pré-visualização, logo abaixo.
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <input value={source} onChange={(e) => setSource(e.target.value)} placeholder="Ex: ITA 2025" style={{ ...input, flex: 1, minWidth: 140 }} />
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <FileDrop label="PDF da prova" onFile={handleExamFile} inputRef={examFileRef} loading={loadingExam} hasContent={!!examText.trim()} />
          <FileDrop label="PDF do gabarito" onFile={handleKeyFile} inputRef={keyFileRef} loading={loadingKey} hasContent={!!keyText.trim()} />
        </div>

        {fileError && <div style={{ fontSize: 12.5, color: "var(--danger)", marginBottom: 10 }}>{fileError}</div>}

        <details open={showRaw}>
          <summary style={{ fontSize: 12.5, color: "var(--muted)", cursor: "pointer", marginBottom: 8 }}>
            Ver / editar texto extraído (ou colar manualmente)
          </summary>
          <textarea value={examText} onChange={(e) => setExamText(e.target.value)}
            placeholder={"Questão 01\nEnunciado...\nA) ...\nB) ...\nC) ...\nD) ...\nE) ...\n\nQuestão 02\n..."}
            style={{ ...input, width: "100%", height: 140, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginTop: 6 }} />
          <div style={{ height: 8 }} />
          <textarea value={keyText} onChange={(e) => setKeyText(e.target.value)}
            placeholder={"Gabarito:\n01 - C\n02 - A\n03 - E"}
            style={{ ...input, width: "100%", height: 80, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical" }} />
        </details>

        <div style={{ marginTop: 12 }}>
          <button onClick={runParse} style={primaryBtn} disabled={!examText.trim()}>Analisar</button>
        </div>
      </Card>

      {pdfPreview && pdfPreview.questions.length === 0 && (
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: "var(--danger)" }}>Nenhuma questão encontrada</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5 }}>
            Não consegui reconhecer o padrão de numeração das questões nesse texto. Abra "Ver / editar texto
            extraído" acima pra conferir como o texto saiu do PDF — se a numeração usa um formato diferente
            (ex: sem a palavra "questão", ou colada com a alternativa anterior), edite o texto manualmente
            deixando cada questão como "Questão 01", "Questão 02"... antes de clicar em Analisar de novo.
          </div>
        </Card>
      )}

      {pdfPreview && pdfPreview.questions.length > 0 && (
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Pré-visualização</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10 }}>
            {pdfPreview.questions.length} questões encontradas · {pdfPreview.questions.filter(q => q.hasAlts).length} com alternativas reconhecidas · {pdfPreview.questions.filter(q => q.hasAlts && q.answer).length} com gabarito cruzado
          </div>

          <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>
              Prova com mais de uma matéria ou assunto? Atribua matéria + assunto por intervalo de questões:
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, color: "var(--muted)" }}>Da questão</span>
              <input type="number" value={rangeFrom} onChange={(e) => setRangeFrom(e.target.value)} style={{ ...input, width: 64 }} />
              <span style={{ fontSize: 12, color: "var(--muted)" }}>até</span>
              <input type="number" value={rangeTo} onChange={(e) => setRangeTo(e.target.value)} style={{ ...input, width: 64 }} />
              <select value={rangeSubject} onChange={(e) => setRangeSubject(e.target.value)} style={input}>
                {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <input value={rangeTopic} onChange={(e) => setRangeTopic(e.target.value)} placeholder="Assunto (ex: Cinemática)" style={{ ...input, flex: 1, minWidth: 140 }} />
              <button onClick={applyRangeSubject} style={ghostBtn}>Aplicar</button>
            </div>
          </div>

          <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, marginBottom: 10, maxHeight: 300, overflowY: "auto" }}>
            <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.4 }}>Mapeamento de matérias</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {Object.entries(pdfPreview.materias).map(([jsonName, mapping]) => {
                const subject = pdfPreview.allSubjects.find((s) => s.id === mapping.mappedSubjectId);
                const qCount = pdfPreview.questions.filter((q) => q.jsonName === jsonName).length;
                return (
                  <div key={jsonName} style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", padding: 8, background: "var(--bg)", borderRadius: 6 }}>
                    <SubjectMark subject={subject} size={8} />
                    <span style={{ fontSize: 13, fontWeight: 600, flex: 1, minWidth: 120 }}>{jsonName}</span>
                    <span style={{ fontSize: 11, color: "var(--muted)", background: mapping.isNew ? "var(--ok)22" : "var(--accent)22", border: `1px solid ${mapping.isNew ? "var(--ok)" : "var(--accent)"}`, borderRadius: 4, padding: "2px 6px" }}>
                      {mapping.isNew ? "Nova matéria" : "Existente"}
                    </span>
                    <span style={{ fontSize: 11, color: "var(--muted)" }}>{qCount} questão{qCount === 1 ? "" : "ões"}</span>
                    <select
                      value={mapping.mappedSubjectId}
                      onChange={(e) => updatePdfMapping(jsonName, e.target.value)}
                      style={{ ...input, minWidth: 180, fontSize: 12, padding: "5px 8px" }}
                    >
                      {pdfPreview.allSubjects.map((s) => (
                        <option key={s.id} value={s.id}>
                          {s.name} {s.id === mapping.mappedSubjectId && mapping.isNew ? " (nova)" : ""}
                        </option>
                      ))}
                      <option value="__new__">➕ Criar como nova matéria</option>
                    </select>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 300, overflowY: "auto" }}>
            {pdfPreview.questions.map((q, idx) => {
              const subj = pdfPreview.allSubjects.find((s) => s.id === q.subjectId);
              return (
                <div key={idx} style={{ border: "1px solid var(--line)", borderRadius: 6, padding: "8px 10px", fontSize: 12.5, background: q.hasAlts ? "var(--surface2)" : "transparent" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, gap: 8, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                      Questão {q.num} {subj && <SubjectMark subject={subj} size={6} />}
                      {subj && <span style={{ fontWeight: 400, color: "var(--muted)", fontSize: 11.5 }}>{subj.name}</span>}
                      {q.topic ? <span style={{ fontWeight: 600, color: "var(--accent2)", fontSize: 11, background: "var(--accent2)22", borderRadius: 4, padding: "1px 6px" }}>{q.topic}</span> : null}
                    </span>
                    <span style={{ color: q.hasAlts ? "var(--ok)" : "var(--danger)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }}>
                      {q.hasAlts ? (q.answer ? `gabarito: ${q.answer} · ${q.altCount} alts` : `sem gabarito · ${q.altCount} alts`) : "alternativas não reconhecidas"}
                    </span>
                  </div>
                  <div style={{ color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{q.statement || "(sem enunciado detectado)"}</div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
            <button onClick={confirmPdfPreview} style={primaryBtn} disabled={pdfPreview.questions.filter(q => q.hasAlts).length === 0}>Confirmar e importar {pdfPreview.questions.filter(q => q.hasAlts).length} questões</button>
            <button onClick={cancelPdfPreview} style={{ ...ghostBtn, borderColor: "var(--danger)", color: "var(--danger)" }}>Cancelar</button>
          </div>
        </Card>
      )}

      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar questões via JSON</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
          Peça pra uma IA gerar questões nesse formato (útil pra puxar questões de bancas específicas, gerar
          questões novas de treino, ou colar algo que você já tem estruturado) — cole ou suba o arquivo aqui.
          Cada questão tem sua banca (source) e você escolhe para qual matéria vai cada uma.
        </div>

        {jsonPreview ? (
          <React.Fragment>
            <div style={{ fontSize: 12.5, color: "var(--accent2)", marginBottom: 10, fontWeight: 600 }}>
              {jsonPreview.questions.length} questão(ões) prontas para importar
            </div>

            <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, marginBottom: 10, maxHeight: 300, overflowY: "auto" }}>
              <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.4 }}>Mapeamento de matérias</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {Object.entries(jsonPreview.materias).map(([jsonName, mapping]) => {
                  const subject = jsonPreview.allSubjects.find((s) => s.id === mapping.mappedSubjectId);
                  const qCount = jsonPreview.questions.filter((q) => q.jsonName === jsonName).length;
                  return (
                    <div key={jsonName} style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", padding: 8, background: "var(--bg)", borderRadius: 6 }}>
                      <SubjectMark subject={subject} size={8} />
                      <span style={{ fontSize: 13, fontWeight: 600, flex: 1, minWidth: 120 }}>{jsonName}</span>
                      <span style={{ fontSize: 11, color: "var(--muted)", background: mapping.isNew ? "var(--ok)22" : "var(--accent)22", border: `1px solid ${mapping.isNew ? "var(--ok)" : "var(--accent)"}`, borderRadius: 4, padding: "2px 6px" }}>
                        {mapping.isNew ? "Nova matéria" : "Existente"}
                      </span>
                      <span style={{ fontSize: 11, color: "var(--muted)" }}>{qCount} questão{qCount === 1 ? "" : "ões"}</span>
                      <select
                        value={mapping.mappedSubjectId}
                        onChange={(e) => updateJsonMapping(jsonName, e.target.value)}
                        style={{ ...input, minWidth: 180, fontSize: 12, padding: "5px 8px" }}
                      >
                        {jsonPreview.allSubjects.map((s) => (
                          <option key={s.id} value={s.id}>
                            {s.name} {s.id === mapping.mappedSubjectId && mapping.isNew ? " (nova)" : ""}
                          </option>
                        ))}
                        <option value="__new__">➕ Criar como nova matéria</option>
                      </select>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button onClick={confirmJsonPreview} style={primaryBtn}>Confirmar e importar</button>
              <button onClick={cancelJsonPreview} style={{ ...ghostBtn, borderColor: "var(--danger)", color: "var(--danger)" }}>Cancelar</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <textarea value={jsonText} onChange={(e) => setJsonText(e.target.value)} placeholder="Cole aqui o JSON gerado pela IA..."
              style={{ ...input, width: "100%", height: 100, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginBottom: 8 }} />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
              <button onClick={importJsonPasted} style={primaryBtn} disabled={!jsonText.trim()}>Analisar JSON</button>
              <label style={{ ...ghostBtn, display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
                Importar arquivo .json
                <input type="file" accept=".json" onChange={importJsonFile} style={{ display: "none" }} />
              </label>
            </div>
            {jsonMsg && <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>{jsonMsg}</div>}
          </React.Fragment>
        )}

        <button onClick={() => setShowJsonFormat((v) => !v)} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px" }}>
          {showJsonFormat ? "Ocultar formato esperado" : "Ver formato esperado"}
        </button>
        {showJsonFormat && (
          <div style={{ marginTop: 8 }}>
            <pre style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, padding: 10, fontSize: 11, overflowX: "auto", fontFamily: "'JetBrains Mono', monospace" }}>{QUESTIONS_JSON_EXAMPLE}</pre>
            <button onClick={copyJsonFormat} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px", marginTop: 6 }}>Copiar formato (pra colar no prompt da IA)</button>
          </div>
        )}
      </Card>
    </div>
  );
}

function FileDrop({ label, onFile, inputRef, loading, hasContent }) {
  return (
    <label style={{
      border: `1px dashed ${hasContent ? "var(--accent)" : "var(--line)"}`, borderRadius: 8, padding: "16px 10px",
      display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer",
      background: hasContent ? "#26303A" : "var(--surface2)", textAlign: "center",
    }}>
      <input ref={inputRef} type="file" accept=".pdf,.txt" onChange={onFile} style={{ display: "none" }} />
      <span style={{ fontSize: 20 }}>{loading ? "⏳" : hasContent ? "✓" : "📄"}</span>
      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{label}</span>
      <span style={{ fontSize: 11, color: "var(--muted)" }}>{loading ? "lendo..." : hasContent ? "carregado — trocar arquivo" : "clique para subir"}</span>
    </label>
  );
}

// ---------- Question bank + practice ----------
function questionAccuracy(qs) {
  const totalAttempts = qs.reduce((a, q) => a + (q.attempts || 0), 0);
  const totalErrors = qs.reduce((a, q) => a + (q.errors || 0), 0);
  const pct = totalAttempts > 0 ? Math.round(((totalAttempts - totalErrors) / totalAttempts) * 100) : null;
  return { totalAttempts, pct };
}

function QuestionBank({ subjects, questions, setQuestions, setTab, celebrationEmoji }) {
  const [filterSubject, setFilterSubject] = useState("all");
  const [filterBanca, setFilterBanca] = useState("all");
  const [filterTopic, setFilterTopic] = useState("all");
  const [manualOpen, setManualOpen] = useState(false);
  const [statsOpen, setStatsOpen] = useState(false);
  const [practiceQueue, setPracticeQueue] = useState(null);

  const bancas = useMemo(() => {
    const set = new Set(questions.map((q) => (q.source || "").trim()).filter(Boolean));
    return [...set].sort((a, b) => a.localeCompare(b));
  }, [questions]);

  const topicos = useMemo(() => {
    const set = new Set(
      questions
        .filter((q) =>
          (filterSubject === "all" || q.subjectId === filterSubject) &&
          (filterBanca === "all" || (q.source || "").trim() === filterBanca)
        )
        .map((q) => (q.topic || "").trim())
        .filter(Boolean)
    );
    return [...set].sort((a, b) => a.localeCompare(b));
  }, [questions, filterSubject, filterBanca]);

  const filtered = questions.filter((q) =>
    (filterSubject === "all" || q.subjectId === filterSubject) &&
    (filterBanca === "all" || (q.source || "").trim() === filterBanca) &&
    (filterTopic === "all" || (q.topic || "").trim() === filterTopic)
  );

  function startPractice(count) {
    const pool = filtered.filter((q) => q.answer);
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, count);
    if (shuffled.length > 0) setPracticeQueue(shuffled.map((q) => q.id));
  }
  function removeQuestion(id) { setQuestions((prev) => prev.filter((q) => q.id !== id)); }
  function addManual(q) {
    setQuestions((prev) => [{ ...q, id: uid(), attempts: 0, errors: 0, userAnswer: null, correct: null, difficulty: null }, ...prev]);
    setManualOpen(false);
  }
  function recordAnswer(id, letter) {
    setQuestions((prev) => prev.map((q) => {
      if (q.id !== id) return q;
      const isCorrect = letter === q.answer;
      return { ...q, userAnswer: letter, correct: isCorrect, attempts: q.attempts + 1, errors: q.errors + (isCorrect ? 0 : 1) };
    }));
  }

  if (practiceQueue) return <Practice questions={questions} queue={practiceQueue} onAnswer={recordAnswer} onExit={() => setPracticeQueue(null)} celebrationEmoji={celebrationEmoji} />;
  if (questions.length === 0) return <Card><EmptyRow text="Nenhuma questão no banco ainda." action="Importar prova" onAction={() => setTab("importar")} /></Card>;

  const overall = questionAccuracy(questions);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <button onClick={() => setStatsOpen((v) => !v)} style={{
          background: "transparent", border: "none", padding: 0, cursor: "pointer", width: "100%",
          display: "flex", alignItems: "center", gap: 8, minHeight: "auto",
        }}>
          <span style={{ fontSize: 11, color: "var(--muted)", width: 12 }}>{statsOpen ? "▼" : "▶"}</span>
          <span style={{ fontSize: 13, fontWeight: 600, flex: 1, textAlign: "left" }}>📊 Contador de questões · {questions.length}</span>
          {overall.pct !== null && <span style={{ fontSize: 12, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>{overall.pct}% acerto</span>}
        </button>
        {statsOpen && (
          <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ fontSize: 12, color: "var(--muted)" }}>
              {questions.length} questões · {overall.totalAttempts} tentativas no total
              {overall.pct !== null && ` · ${overall.pct}% de acerto geral`}
            </div>
            <div>
              <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.4 }}>Por matéria</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {subjects.map((s) => {
                  const qs = questions.filter((q) => q.subjectId === s.id);
                  if (qs.length === 0) return null;
                  const acc = questionAccuracy(qs);
                  return (
                    <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
                      <SubjectMark subject={s} size={7} />
                      <span style={{ flex: 1 }}>{s.name}</span>
                      <span style={{ color: "var(--muted)" }}>{qs.length} questões</span>
                      {acc.pct !== null && <span style={{ color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace", width: 42, textAlign: "right" }}>{acc.pct}%</span>}
                    </div>
                  );
                })}
              </div>
            </div>
            {bancas.length > 0 && (
              <div>
                <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.4 }}>Por banca</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {bancas.map((b) => {
                    const qs = questions.filter((q) => (q.source || "").trim() === b);
                    const acc = questionAccuracy(qs);
                    return (
                      <div key={b} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
                        <span style={{ flex: 1 }}>{b}</span>
                        <span style={{ color: "var(--muted)" }}>{qs.length} questões</span>
                        {acc.pct !== null && <span style={{ color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace", width: 42, textAlign: "right" }}>{acc.pct}%</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}
      </Card>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>Banco de questões · {filtered.length}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select value={filterSubject} onChange={(e) => { setFilterSubject(e.target.value); setFilterTopic("all"); }} style={input}>
              <option value="all">Todas as matérias</option>
              {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {bancas.length > 0 && (

              <select value={filterTopic} onChange={(e) => setFilterTopic(e.target.value)} style={input}>

                  {q.topic ? <span style={{ color: "var(--accent2)", fontWeight: 600 }}>· {q.topic}</span> : null}
                </div>
                <button onClick={() => removeQuestion(q.id)} style={iconBtn} aria-label="Remover questão">×</button>

                <span>Erros: {q.errors}</span>

          );
        })}

    </div>
  );
}

function ManualQuestionForm({ subjects, onSave }) {
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [source, setSource] = useState("");
  const [topic, setTopic] = useState("");
  const [statement, setStatement] = useState("");
  const [alts, setAlts] = useState({ A: "", B: "", C: "", D: "", E: "" });
  const [answer, setAnswer] = useState("A");

  function save() {
    if (!statement.trim()) return;
    onSave({ subjectId, source: source.trim() || "Manual", topic: topic.trim(), statement: statement.trim(), alternatives: alts, answer });
    setSource(""); setTopic(""); setStatement(""); setAlts({ A: "", B: "", C: "", D: "", E: "" });
  }

  return (
    <Card>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Nova questão</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <input value={source} onChange={(e) => setSource(e.target.value)} placeholder="Fonte (ex: ITA 2025)" style={{ ...input, flex: 1, minWidth: 120 }} />
          <input value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Tópico (ex: Geometria)" style={{ ...input, flex: 1, minWidth: 120 }} />
        </div>
        <textarea value={statement} onChange={(e) => setStatement(e.target.value)} placeholder="Enunciado" style={{ ...input, width: "100%", height: 60, resize: "vertical" }} />
        {LETTERS.map((l) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12.5, color: "var(--muted)", width: 60 }}>
              <input type="radio" name="answer" checked={answer === l} onChange={() => setAnswer(l)} /> {l})
            </label>
            <input value={alts[l]} onChange={(e) => setAlts((prev) => ({ ...prev, [l]: e.target.value }))} placeholder={`Alternativa ${l}`} style={{ ...input, flex: 1 }} />
          </div>
        ))}
        <div><button onClick={save} style={primaryBtn} disabled={!statement.trim()}>Salvar questão</button></div>
      </div>
    </Card>
  );
}

function Practice({ questions, queue, onAnswer, onExit, celebrationEmoji }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const q = questions.find((x) => x.id === queue[idx]);
  const correctCount = queue.slice(0, idx).filter((id) => questions.find((x) => x.id === id)?.correct).length;

  if (!q) {
    return (
      <Card>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Sessão de prática concluída {celebrationEmoji || "🔥"}</div>
        <div style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 12 }}>{correctCount}/{queue.length} acertos</div>
        <button onClick={onExit} style={primaryBtn}>Voltar ao banco</button>
      </Card>
    );
  }

  function choose(letter) { if (picked) return; setPicked(letter); onAnswer(q.id, letter); }
  function next() { setPicked(null); setIdx((i) => i + 1); }

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--muted)", marginBottom: 10 }}>
        <span>Questão {idx + 1} de {queue.length}</span>
        <button onClick={onExit} style={{ ...iconBtn, fontSize: 12.5 }}>Sair</button>
      </div>
      <div style={{ fontSize: 14.5, marginBottom: 14, lineHeight: 1.5 }}>{q.statement}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {LETTERS.filter((l) => q.alternatives?.[l]).map((l) => {
          const isCorrectAns = picked && l === q.answer;
          const isWrongPick = picked && picked === l && l !== q.answer;
          return (
            <button key={l} onClick={() => choose(l)} disabled={!!picked} style={{
              textAlign: "left", padding: "10px 12px", borderRadius: 6,
              border: `1px solid ${isCorrectAns ? "var(--ok)" : isWrongPick ? "var(--danger)" : "var(--line)"}`,
              background: isCorrectAns ? "#8FBF5F1A" : isWrongPick ? "#D970661A" : "var(--surface2)",
              color: "var(--text)", fontSize: 13.5, cursor: picked ? "default" : "pointer",
            }}><strong>{l})</strong> {q.alternatives[l]}</button>
          );
        })}
      </div>
      {picked && (
        <div style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: picked === q.answer ? "var(--ok)" : "var(--danger)", fontWeight: 600 }}>
            {picked === q.answer ? "Certo!" : `Errado — resposta: ${q.answer}`}
          </span>
          <button onClick={next} style={primaryBtn}>{idx + 1 < queue.length ? "Próxima" : "Finalizar"}</button>
        </div>
      )}
    </Card>
  );
}

function buildPackPreview(data, existingPackIds) {
  if (!data || typeof data !== "object") throw new Error("O arquivo precisa ser um objeto JSON com pacote e questoes.");
  const p = data.pacote;
  if (!p || typeof p !== "object") throw new Error("Pacote inválido: objeto pacote não encontrado. Esta área aceita somente pacotes de estudo.");
  if (!p.id || !String(p.id).trim()) throw new Error("Pacote inválido: campo pacote.id é obrigatório.");
  if (!p.nome || !String(p.nome).trim()) throw new Error("Pacote inválido: campo pacote.nome é obrigatório.");
  if ((existingPackIds || []).includes(String(p.id).trim())) throw new Error("Este pacote já foi importado (id: " + String(p.id).trim() + ").");
  if (!Array.isArray(data.questoes) || data.questoes.length === 0) throw new Error("Pacote inválido: array questoes vazio ou ausente.");

  const normDiff = (d) => {
    const t = String(d == null ? "" : d).trim();
    if (!PACK_DIFF_ORDER.includes(t)) throw new Error("Dificuldade inválida: " + (t || "(vazia)") + ". Use: " + PACK_DIFF_ORDER.join(", ") + ".");
    return t;
  };

  const questions = data.questoes.map((q, i) => {
    const n = i + 1;
    if (!q || typeof q !== "object") throw new Error("Questão " + n + ": bloco inválido.");
    if (!q.materia || !String(q.materia).trim()) throw new Error("Questão " + n + ": campo materia é obrigatório.");
    if (!q.enunciado || !String(q.enunciado).trim()) throw new Error("Questão " + n + ": campo enunciado é obrigatório.");
    const alts = q.alternativas && typeof q.alternativas === "object" ? q.alternativas : null;
    if (!alts) throw new Error("Questão " + n + ": campo alternativas ausente ou inválido.");
    const altMap = {};
    ["A", "B", "C", "D", "E"].forEach((L) => {
      const raw = alts[L] != null ? alts[L] : alts[L.toLowerCase()];
      if (raw == null || !String(raw).trim()) throw new Error("Questão " + n + ": alternativa " + L + " ausente ou vazia (exigidas A, B, C, D e E).");
      altMap[L] = String(raw).trim();
    });
    const gab = q.gabarito ? String(q.gabarito).toUpperCase().trim() : "";
    if (!["A", "B", "C", "D", "E"].includes(gab)) throw new Error("Questão " + n + ": gabarito deve ser A, B, C, D ou E.");
    return {
      code: q.id != null && String(q.id).trim() ? String(q.id).trim().slice(0, 80) : ("q" + n),
      numero: Number.isFinite(Number(q.numero)) ? Number(q.numero) : n,
      materia: String(q.materia).trim().slice(0, 60),
      assunto: (q.assunto || "").trim().slice(0, 80),
      subassunto: (q.subassunto || "").trim().slice(0, 80),
      tema: (q.tema || "").trim().slice(0, 120),
      difficulty: normDiff(q.dificuldade),
      tipo: (q.tipo || "Múltipla escolha").trim().slice(0, 40),
      banca: (q.banca || "").trim().slice(0, 80),
      statement: String(q.enunciado).trim(),
      alternatives: altMap,
      answer: gab,
      explanation: (q.explicacao || "").trim().slice(0, 4000),
      tags: Array.isArray(q.tags) ? q.tags.map((t) => String(t).trim()).filter(Boolean).slice(0, 8) : [],
      verified: q.verificado === true,
      attempts: 0, errors: 0, userAnswer: null, correct: null,
    };
  });

  const seen = new Set();
  questions.forEach((q) => {
    if (seen.has(q.code)) throw new Error("Código duplicado no pacote: " + q.code);
    seen.add(q.code);
  });
  questions.sort((a, b) => a.numero - b.numero);

  const diffCount = {};
  questions.forEach((q) => { diffCount[q.difficulty] = (diffCount[q.difficulty] || 0) + 1; });

  return {
    pack: {
      packId: String(p.id).trim(),
      nome: String(p.nome).trim().slice(0, 120),
      materia: (p.materia || "").trim().slice(0, 60),
      assunto: (p.assunto || "").trim().slice(0, 80),
      subassunto: (p.subassunto || "").trim().slice(0, 80),
      quantidade: Number.isFinite(Number(p.quantidade)) ? Number(p.quantidade) : questions.length,
      dificuldade: (p.dificuldade || "").trim().slice(0, 40),
      origem: (p.origem || "").trim().slice(0, 80),
      versao: (p.versao || "").trim().slice(0, 20),
      descricao: (p.descricao || "").trim().slice(0, 500),
    },
    questions,
    diffCount,
    withExpl: questions.filter((q) => q.explanation).length,
  };
}

function packStats(pack) {
  const qs = pack.questions || [];
  const answered = qs.filter((q) => q.userAnswer != null);
  const correct = qs.filter((q) => q.correct === true);
  const wrong = qs.filter((q) => q.correct === false);
  return {
    total: qs.length,
    answered: answered.length,
    correct: correct.length,
    wrong: wrong.length,
    pct: answered.length ? Math.round((correct.length / answered.length) * 100) : null,
  };
}

function PackImport({ onImport, existingIds }) {
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const [msgErr, setMsgErr] = useState(false);
  const [preview, setPreview] = useState(null);

  function analyzeRaw(raw, fromFile) {
    setMsg(""); setMsgErr(false); setPreview(null);
    try {
      const data = JSON.parse(raw);
      const pv = buildPackPreview(data, existingIds);
      setPreview(pv);
      setMsg(pv.questions.length + " questões válidas — confira e confirme.");
    } catch (e) {
      setMsg((e && e.message) || (fromFile ? "Não consegui ler esse arquivo." : "JSON inválido."));
      setMsgErr(true);
    }
  }
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then((t) => analyzeRaw(t, true)).catch(() => { setMsg("Não consegui ler esse arquivo."); setMsgErr(true); });
    e.target.value = "";
  }
  function confirm() {
    if (!preview) return;
    onImport(preview);
    setPreview(null);
    setText("");
    setMsg("");
  }

  return (
    <Card>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar Pacote de Estudo</div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
        Aceita somente pacotes com objeto <strong>pacote</strong> e array <strong>questoes</strong>, cada questão com
        matéria, enunciado, alternativas A–E e gabarito. Nada aqui toca o banco padrão de questões.
      </div>
      {!preview ? (
        <React.Fragment>
          <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Cole aqui o JSON do pacote..."
            style={{ ...input, width: "100%", height: 110, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginBottom: 8 }} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
            <button onClick={() => analyzeRaw(text, false)} style={primaryBtn} disabled={!text.trim()}>Analisar pacote</button>
            <label style={{ ...ghostBtn, display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
              Arquivo .json
              <input type="file" accept=".json" onChange={handleFile} style={{ display: "none" }} />
            </label>
          </div>
          {msg && <div style={{ fontSize: 12, color: msgErr ? "var(--danger)" : "var(--muted)", marginBottom: 8 }}>{msg}</div>}
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, marginBottom: 10 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 4 }}>{preview.pack.nome}</div>
            <div style={{ fontSize: 12, color: "var(--muted)", lineHeight: 1.6 }}>
              {[preview.pack.materia, preview.pack.assunto, preview.pack.subassunto].filter(Boolean).join(" › ") || "—"}
              <br />
              {preview.questions.length} questões
              {preview.pack.dificuldade ? ` · ${preview.pack.dificuldade}` : ""}
              {preview.pack.versao ? ` · v${preview.pack.versao}` : ""}
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
              {PACK_DIFF_ORDER.filter((d) => preview.diffCount[d]).map((d) => (
                <span key={d} style={{ fontSize: 11, fontWeight: 700, color: PACK_DIFF_COLORS[d], background: PACK_DIFF_COLORS[d] + "22", border: `1px solid ${PACK_DIFF_COLORS[d]}`, borderRadius: 12, padding: "2px 9px" }}>
                  {d}: {preview.diffCount[d]}
                </span>
              ))}
              {preview.withExpl > 0 && (
                <span style={{ fontSize: 11, color: "var(--muted)", border: "1px solid var(--line)", borderRadius: 12, padding: "2px 9px" }}>
                  💡 {preview.withExpl} com explicação
                </span>
              )}
            </div>
          </div>
          {msg && <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>{msg}</div>}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={confirm} style={primaryBtn}>Confirmar importação</button>
            <button onClick={() => { setPreview(null); setMsg(""); }} style={ghostBtn}>Descartar</button>
          </div>
        </React.Fragment>
      )}
    </Card>
  );
}

function PackStudy({ pack, onSavePack, onExit }) {
  const [idx, setIdx] = useState(Math.min(pack.current || 0, Math.max(0, pack.questions.length - 1)));
  const [picked, setPicked] = useState(null);
  const [mode, setMode] = useState("all");

  const ordered = [...(pack.questions || [])].sort((a, b) => a.numero - b.numero);
  const queue = mode === "errors" ? ordered.filter((q) => q.correct === false) : ordered;
  const q = queue[Math.min(idx, Math.max(0, queue.length - 1))];
  const st = packStats(pack);
  const stDiff = PACK_DIFF_ORDER.map((d) => {
    const qs = (pack.questions || []).filter((x) => x.difficulty === d);
    if (!qs.length) return null;
    const ans = qs.filter((x) => x.userAnswer != null).length;
    const ok = qs.filter((x) => x.correct === true).length;
    return { d, total: qs.length, ans, ok };
  }).filter(Boolean);

  function persist(nextQuestions, nextIdx) {
    onSavePack({ ...pack, questions: nextQuestions, current: nextIdx == null ? pack.current : nextIdx });
  }
  function choose(letter) {
    if (picked || !q) return;
    setPicked(letter);
    const ok = letter === q.answer;
    const next = (pack.questions || []).map((x) => (
      x.code === q.code
        ? { ...x, userAnswer: letter, correct: ok, attempts: (x.attempts || 0) + 1, errors: (x.errors || 0) + (ok ? 0 : 1) }
        : x
    ));
    persist(next, q.numero);
  }
  function next() {
    setPicked(null);
    const ni = Math.min(idx + 1, queue.length - 1);
    setIdx(ni);
    const nq = queue[ni];
    if (nq) onSavePack({ ...pack, current: nq.numero });
  }
  function retryQuestion() {
    if (!q) return;
    const next = (pack.questions || []).map((x) => (x.code === q.code ? { ...x, userAnswer: null, correct: null } : x));
    persist(next, pack.current);
    setPicked(null);
  }
  function resetPack() {
    if (!window.confirm("Zerar todo o progresso deste pacote?")) return;
    const next = (pack.questions || []).map((x) => ({ ...x, userAnswer: null, correct: null, attempts: 0, errors: 0 }));
    persist(next, 0);
    setPicked(null);
    setIdx(0);
    setMode("all");
  }

  if (!ordered.length) {
    return (
      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>{pack.nome}</div>
        <EmptyRow text="Este pacote não tem questões." action="Voltar" onAction={onExit} />
      </Card>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          <button onClick={onExit} style={iconBtn} aria-label="Voltar aos pacotes">‹</button>
          <span style={{ fontSize: 13.5, fontWeight: 700, flex: 1 }}>{pack.nome}</span>
          <button onClick={resetPack} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11 }}>Zerar progresso</button>
        </div>
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>
          {[pack.materia, pack.assunto, pack.subassunto].filter(Boolean).join(" › ")}
        </div>
        <div style={{ height: 7, background: "var(--surface2)", borderRadius: 4, overflow: "hidden", marginBottom: 6 }}>
          <div style={{ width: `${st.total ? Math.round((st.answered / st.total) * 100) : 0}%`, height: "100%", background: "var(--accent)", borderRadius: 4 }} />
        </div>
        <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>
          {st.answered}/{st.total} respondidas · {st.correct} acertos{st.pct !== null ? ` · ${st.pct}%` : ""} · {st.wrong} erros
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
          <button onClick={() => { setMode("all"); setPicked(null); setIdx(0); }} style={mode === "all" ? primaryBtn : ghostBtn}>Estudar tudo</button>
          <button onClick={() => { setMode("errors"); setPicked(null); setIdx(0); }} style={mode === "errors" ? primaryBtn : ghostBtn} disabled={st.wrong === 0}>
            Revisar erros ({st.wrong})
          </button>
        </div>
      </Card>

      {mode === "errors" && queue.length === 0 ? (
        <Card><EmptyRow text="Nenhum erro para revisar. 🎉" action="Estudar tudo" onAction={() => setMode("all")} /></Card>
      ) : q ? (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--muted)", marginBottom: 10, gap: 8, flexWrap: "wrap" }}>
            <span>Questão {q.numero} · {Math.min(idx + 1, queue.length)} de {queue.length}{mode === "errors" ? " (erros)" : ""}</span>
            {q.difficulty && PACK_DIFF_COLORS[q.difficulty] ? (
              <span style={{ fontSize: 10.5, fontWeight: 700, color: PACK_DIFF_COLORS[q.difficulty], background: PACK_DIFF_COLORS[q.difficulty] + "22", border: `1px solid ${PACK_DIFF_COLORS[q.difficulty]}`, borderRadius: 12, padding: "1px 8px" }}>
                {q.difficulty}
              </span>
            ) : null}
          </div>
          {q.tema ? <div style={{ fontSize: 11.5, color: "var(--accent)", fontWeight: 600, marginBottom: 6 }}>{q.tema}</div> : null}
          <div style={{ fontSize: 14.5, marginBottom: 14, lineHeight: 1.5 }}>{q.statement}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {["A", "B", "C", "D", "E"].filter((l) => q.alternatives && q.alternatives[l]).map((l) => {
              const isCorrectAns = picked && l === q.answer;
              const isWrongPick = picked && picked === l && l !== q.answer;
              return (
                <button key={l} onClick={() => choose(l)} disabled={!!picked} style={{
                  textAlign: "left", padding: "10px 12px", borderRadius: 6,
                  border: `1px solid ${isCorrectAns ? "var(--ok)" : isWrongPick ? "var(--danger)" : "var(--line)"}`,
                  background: isCorrectAns ? "#8FBF5F1A" : isWrongPick ? "#D970661A" : "var(--surface2)",
                  color: "var(--text)", fontSize: 13.5, cursor: picked ? "default" : "pointer",
                }}><strong>{l})</strong> {q.alternatives[l]}</button>
              );
            })}
          </div>
          {picked && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <span style={{ fontSize: 13, color: picked === q.answer ? "var(--ok)" : "var(--danger)", fontWeight: 600 }}>
                  {picked === q.answer ? "Certo!" : `Errado — resposta: ${q.answer}`}
                </span>
                <div style={{ display: "flex", gap: 8 }}>
                  {mode === "errors" && <button onClick={retryQuestion} style={ghostBtn}>Tentar de novo</button>}
                  <button onClick={next} style={primaryBtn}>{idx + 1 < queue.length ? "Próxima" : "Finalizar"}</button>
                </div>
              </div>
              {q.explanation ? (
                <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: "10px 12px" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--accent2)", marginBottom: 4 }}>💡 Explicação</div>
                  <div style={{ fontSize: 13, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>{q.explanation}</div>
                </div>
              ) : null}
            </div>
          )}
          {(q.tags || []).length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
              {q.tags.map((t) => (
                <span key={t} style={{ fontSize: 10.5, color: "var(--muted)", border: "1px solid var(--line)", borderRadius: 12, padding: "1px 8px" }}>#{t}</span>
              ))}
            </div>
          )}
        </Card>
      ) : null}

      <Card>
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.4 }}>Por dificuldade</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {stDiff.map((r) => (
            <div key={r.d} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
              <Dot color={PACK_DIFF_COLORS[r.d] || "#8A96A3"} size={7} />
              <span style={{ flex: 1 }}>{r.d}</span>
              <span style={{ color: "var(--muted)" }}>{r.ans}/{r.total}</span>
              <span style={{ color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace", width: 70, textAlign: "right" }}>{r.ok} ok</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function PackPrompt({ subjects, topics }) {
  const list = (subjects || []).filter((s) => s && s.name);
  const [materia, setMateria] = useState(list[0] ? list[0].name : "Matemática");
  const [customMateria, setCustomMateria] = useState("");
  const [assunto, setAssunto] = useState("");
  const [subassunto, setSubassunto] = useState("");
  const [quantidade, setQuantidade] = useState(20);
  const [showFormat, setShowFormat] = useState(false);
  const [showGuide, setShowGuide] = useState(false);
  const [copied, setCopied] = useState(false);

  const isGeral = materia === "__all__";
  const effMateria = materia === "__custom__" ? customMateria.trim() : isGeral ? list.map((s) => s.name).join(", ") : materia;
  const prompt = buildPackPrompt({ materia: effMateria || "Matemática", assunto, subassunto, quantidade, materias: list });

  // assuntos/subtemas que o usuário já tem no Guia de Estudos, para a matéria escolhida
  // (no modo geral, de todas as matérias)
  const effSubject = materia === "__custom__"
    ? list.find((s) => s.name.toLowerCase() === (customMateria.trim().toLowerCase()))
    : isGeral ? null : list.find((s) => s.name === materia);
  const guideTopics = isGeral
    ? (topics || []).filter((t) => list.some((s) => s.id === t.subjectId))
    : effSubject ? (topics || []).filter((t) => t.subjectId === effSubject.id) : [];
  function appendUnique(setter, val) {
    setter((prev) => {
      const parts = String(prev || "").split(",").map((p) => p.trim()).filter(Boolean);
      if (!parts.includes(val)) parts.push(val);
      return parts.join(", ");
    });
  }
  function pickGuideTopic(t) {
    if (isGeral) appendUnique(setAssunto, t.name);
    else setAssunto(t.name);
  }
  function pickGuideSub(t, stName) {
    if (isGeral) { appendUnique(setAssunto, t.name); appendUnique(setSubassunto, stName); }
    else { setAssunto(t.name); setSubassunto(stName); }
  }
  function subjectNameOf(t) {
    const s = list.find((x) => x.id === t.subjectId);
    return s ? s.name : "";
  }
  const assuntoParts = String(assunto || "").split(",").map((p) => p.trim()).filter(Boolean);
  const subParts = String(subassunto || "").split(",").map((p) => p.trim()).filter(Boolean);

  function copyPrompt() {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(done).catch(done);
    } else { done(); }
  }
  function copyFormat() {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(PACK_JSON_EXAMPLE).then(done).catch(done);
    } else { done(); }
  }

  return (
    <Card>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>🤖 Gerar pacote com IA</div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
        Monte o pedido com suas matérias, copie o prompt pronto, cole na IA de sua escolha e importe o JSON aqui.
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
        <select value={materia} onChange={(e) => setMateria(e.target.value)} style={input} title="Matéria (da sua lista)">
          {list.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
          {list.length > 0 && <option value="__all__">🌐 Geral — todas as matérias</option>}
          <option value="__custom__">✏️ Outra (digitar)</option>
        </select>
        {materia === "__custom__" && (
          <input value={customMateria} onChange={(e) => setCustomMateria(e.target.value)} placeholder="Nome da matéria" style={{ ...input, flex: 1, minWidth: 130 }} />
        )}
        <input value={assunto} onChange={(e) => setAssunto(e.target.value)} placeholder="Assunto (ex: Funções)" style={{ ...input, flex: 1, minWidth: 130 }} />
        <input value={subassunto} onChange={(e) => setSubassunto(e.target.value)} placeholder="Subassunto (ex: Domínio e imagem)" style={{ ...input, flex: 1, minWidth: 150 }} />
        <input type="number" min={1} max={200} value={quantidade} onChange={(e) => setQuantidade(Number(e.target.value) || 20)} title="Quantidade de questões" style={{ ...input, width: 76 }} />
      </div>
      <textarea value={prompt} readOnly rows={6}
        style={{ ...input, width: "100%", fontSize: 12, resize: "vertical", marginBottom: 8, color: "var(--muted)" }} />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={copyPrompt} style={primaryBtn}>{copied ? "Copiado ✓" : "Copiar prompt pronto"}</button>
        <button onClick={() => setShowGuide((v) => !v)} style={ghostBtn}>{showGuide ? "Ocultar guia" : "📥 Puxar assuntos do app"}</button>
        <button onClick={() => setShowFormat((v) => !v)} style={ghostBtn}>{showFormat ? "Ocultar formato" : "Ver formato esperado"}</button>
      </div>
      {showGuide && (
        <div style={{ marginTop: 8, background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, padding: 10 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11.5, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 0.4 }}>
              Do seu Guia de Estudos{isGeral ? " · todas as matérias" : effSubject ? ` · ${effSubject.name}` : ""}
            </span>
            {guideTopics.length > 0 && (
              <button
                onClick={() => {
                  setAssunto(guideTopics.map((t) => t.name).join(", "));
                  const subs = [];
                  guideTopics.forEach((t) => (t.subtopics || []).forEach((st) => subs.push(st.name)));
                  setSubassunto(subs.join(", "));
                }}
                title="Preencher com todos os assuntos e subtemas"
                style={{ ...ghostBtn, padding: "3px 10px", fontSize: 11.5, minHeight: "auto" }}
              >
                📥 Usar todos ({guideTopics.length})
              </button>
            )}
          </div>
          {!isGeral && !effSubject ? (
            <div style={{ fontSize: 12, color: "var(--muted)" }}>Escolha uma matéria da sua lista acima (ou digite o nome igual ao do Guia).</div>
          ) : guideTopics.length === 0 ? (
            <div style={{ fontSize: 12, color: "var(--muted)" }}>
              {isGeral ? "Nenhum assunto no Guia ainda — adicione na aba Guia de Estudos." : "Nenhum assunto no Guia para essa matéria ainda — adicione na aba Guia de Estudos."}
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 200, overflowY: "auto" }}>
              {guideTopics.map((t) => (
                <div key={t.id}>
                  <button
                    onClick={() => pickGuideTopic(t)}
                    title={isGeral ? "Adicionar este assunto" : "Usar como assunto"}
                    style={{
                      ...ghostBtn, padding: "4px 10px", fontSize: 12.5, fontWeight: 700, marginBottom: 4,
                      borderColor: (isGeral ? assuntoParts.includes(t.name) : assunto === t.name) ? "var(--accent)" : "var(--line)",
                      background: (isGeral ? assuntoParts.includes(t.name) : assunto === t.name) ? "var(--accent)22" : "transparent",
                    }}
                  >
                    📁 {isGeral && subjectNameOf(t) ? `${subjectNameOf(t)} › ` : ""}{t.name}
                  </button>
                  {(t.subtopics || []).length > 0 && (
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginLeft: 12 }}>
                      {(t.subtopics || []).map((st) => (
                        <button
                          key={st.id}
                          onClick={() => pickGuideSub(t, st.name)}
                          title={isGeral ? "Adicionar assunto + subassunto" : "Usar assunto + subassunto"}
                          style={{
                            ...ghostBtn, padding: "3px 8px", fontSize: 11.5, minHeight: "auto",
                            borderColor: (isGeral ? subParts.includes(st.name) : (subassunto === st.name && assunto === t.name)) ? "var(--accent2)" : "var(--line)",
                            background: (isGeral ? subParts.includes(st.name) : (subassunto === st.name && assunto === t.name)) ? "var(--accent2)22" : "transparent",
                          }}
                        >
                          {st.name}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {showFormat && (
        <div style={{ marginTop: 8 }}>
          <pre style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, padding: 10, fontSize: 11, overflowX: "auto", fontFamily: "'JetBrains Mono', monospace", whiteSpace: "pre-wrap" }}>{PACK_JSON_EXAMPLE}</pre>
          <button onClick={copyFormat} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px", marginTop: 6 }}>Copiar formato</button>
        </div>
      )}
    </Card>
  );
}

function StudyPacks({ packs, setPacks, subjects, topics }) {
  const [importing, setImporting] = useState(false);
  const [showPrompt, setShowPrompt] = useState(false);
  const [openPackId, setOpenPackId] = useState(null);

  function handleImport(preview) {
    const now = new Date().toISOString();
    const pack = {
      id: uid(),
      packId: preview.pack.packId,
      nome: preview.pack.nome,
      materia: preview.pack.materia,
      assunto: preview.pack.assunto,
      subassunto: preview.pack.subassunto,
      quantidade: preview.pack.quantidade,
      dificuldade: preview.pack.dificuldade,
      origem: preview.pack.origem,
      versao: preview.pack.versao,
      descricao: preview.pack.descricao,
      importedAt: now,
      current: 0,
      questions: preview.questions,
    };
    setPacks((prev) => [pack, ...prev]);
    setImporting(false);
    setOpenPackId(pack.id);
  }
  function savePack(updated) {
    setPacks((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));
  }
  function deletePack(id) {
    if (!window.confirm("Excluir este pacote e todo o progresso dele?")) return;
    setPacks((prev) => prev.filter((p) => p.id !== id));
    if (openPackId === id) setOpenPackId(null);
  }

  const openPack = (packs || []).find((p) => p.id === openPackId);
  if (openPack) {
    return <PackStudy pack={openPack} onSavePack={savePack} onExit={() => setOpenPackId(null)} />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 6 }}>
          <span style={{ fontSize: 15, fontWeight: 700 }}>📚 Estudo por Assunto · {(packs || []).length}</span>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setShowPrompt((v) => !v)} style={ghostBtn}>{showPrompt ? "Fechar gerador" : "🤖 Gerar com IA"}</button>
            <button onClick={() => setImporting((v) => !v)} style={primaryBtn}>{importing ? "Fechar" : "Importar Pacote de Estudo"}</button>
          </div>
        </div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5 }}>
          Pacotes temáticos isolados (ex: Matemática › Funções › Domínio e imagem), com progresso próprio.
          Nada aqui se mistura com o banco padrão de questões.
        </div>
      </Card>

      {showPrompt && <PackPrompt subjects={subjects} topics={topics} />}

      {importing && <PackImport onImport={handleImport} existingIds={(packs || []).map((p) => p.packId)} />}

      {(packs || []).length === 0 && !importing && (
        <Card><EmptyRow text="Nenhum pacote ainda. Importe seu primeiro pacote de estudo." /></Card>
      )}

      {(packs || []).map((p) => {
        const st = packStats(p);
        const pct = st.total ? Math.round((st.answered / st.total) * 100) : 0;
        return (
          <Card key={p.id}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>
              <span style={{ fontSize: 13.5, fontWeight: 700, flex: 1, minWidth: 160 }}>{p.nome}</span>
              <button onClick={() => setOpenPackId(p.id)} style={primaryBtn}>{st.answered > 0 ? "Continuar" : "Começar"}</button>
              <button onClick={() => deletePack(p.id)} style={{ ...iconBtn, color: "var(--danger)" }} aria-label="Excluir pacote">×</button>
            </div>
            <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>
              {[p.materia, p.assunto, p.subassunto].filter(Boolean).join(" › ") || "—"}
              {p.dificuldade ? ` · ${p.dificuldade}` : ""}
              {p.versao ? ` · v${p.versao}` : ""}
            </div>
            <div style={{ height: 7, background: "var(--surface2)", borderRadius: 4, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ width: `${pct}%`, height: "100%", background: "var(--accent)", borderRadius: 4 }} />
            </div>
            <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>
              {st.total} questões · {st.answered} respondidas · {st.correct} acertos{st.pct !== null ? ` · ${st.pct}%` : ""}
            </div>
            {p.descricao ? <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6, lineHeight: 1.5 }}>{p.descricao}</div> : null}
          </Card>
        );
      })}
    </div>
  );
}
