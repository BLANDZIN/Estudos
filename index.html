function GuiaEstudos({ subjects, setSubjects, topics, setTopics }) {
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [topicName, setTopicName] = useState("");
  const [subtopicInputs, setSubtopicInputs] = useState({});
  const [pasteText, setPasteText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [showFormat, setShowFormat] = useState(false);
  const [collapsed, setCollapsed] = useState({});
  const [collapsedTopics, setCollapsedTopics] = useState({});
  const [search, setSearch] = useState("");

  function toggleCollapsed(id) {
    setCollapsed((prev) => {
      const current = prev[id] === undefined ? true : prev[id];
      return { ...prev, [id]: !current };
    });
  }
  function toggleTopicCollapsed(id) {
    setCollapsedTopics((prev) => {
      const current = prev[id] === undefined ? true : prev[id];
      return { ...prev, [id]: !current };
    });
  }

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  function addTopic() {
    if (!subjectId || !topicName.trim()) return;
    setTopics((prev) => [...prev, { id: uid(), subjectId, name: topicName.trim(), status: "nao_estudado", subtopics: [] }]);
    setTopicName("");
  }
  function removeTopic(id) { setTopics((prev) => prev.filter((t) => t.id !== id)); }
  function cycleTopicStatus(id) {
    setTopics((prev) => prev.map((t) => (t.id === id ? { ...t, status: nextStatus(t.status) } : t)));
  }
  function addSubtopic(topicId) {
    const name = (subtopicInputs[topicId] || "").trim();
    if (!name) return;
    setTopics((prev) => prev.map((t) => (t.id === topicId ? { ...t, subtopics: [...t.subtopics, { id: uid(), name, status: "nao_estudado" }] } : t)));
    setSubtopicInputs((prev) => ({ ...prev, [topicId]: "" }));
  }
  function removeSubtopic(topicId, subId) {
    setTopics((prev) => prev.map((t) => (t.id === topicId ? { ...t, subtopics: t.subtopics.filter((st) => st.id !== subId) } : t)));
  }
  function cycleSubtopicStatus(topicId, subId) {
    setTopics((prev) => prev.map((t) => {
      if (t.id !== topicId) return t;
      return { ...t, subtopics: t.subtopics.map((st) => (st.id === subId ? { ...st, status: nextStatus(st.status) } : st)) };
    }));
  }

  function mergeGuideJson(data) {
    if (!data || !Array.isArray(data.materias)) throw new Error("formato inválido");
    let currentSubjects = subjects;
    const newTopics = [];
    data.materias.forEach((m) => {
      if (!m.nome) return;
      let subj = currentSubjects.find((s) => s.name.toLowerCase().trim() === String(m.nome).toLowerCase().trim());
      if (!subj) {
        subj = { id: uid(), name: String(m.nome).trim(), color: PALETTE[currentSubjects.length % PALETTE.length], icon: null };
        currentSubjects = [...currentSubjects, subj];
      }
      (m.assuntos || []).forEach((a) => {
        if (!a || !a.nome) return;
        const subtopics = Array.isArray(a.subtopicos) ? a.subtopicos.map((st) => (
          typeof st === "string" ? { id: uid(), name: st, status: "nao_estudado" } : { id: uid(), name: st.nome || "Sem nome", status: STATUS_ORDER.includes(st.status) ? st.status : "nao_estudado" }
        )) : [];
        newTopics.push({ id: uid(), subjectId: subj.id, name: String(a.nome).trim(), status: "nao_estudado", subtopics });
      });
    });
    setSubjects(currentSubjects);
    setTopics((prev) => [...prev, ...newTopics]);
    return newTopics.length;
  }

  function importPasted() {
    try {
      const data = JSON.parse(pasteText);
      const count = mergeGuideJson(data);
      setImportMsg(`${count} assunto(s) importado(s) com sucesso.`);
      setPasteText("");
    } catch (e) {
      setImportMsg("JSON inválido — confira o formato esperado abaixo.");
    }
  }

  async function importFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const count = mergeGuideJson(data);
      setImportMsg(`${count} assunto(s) importado(s) com sucesso.`);
    } catch (err) {
      setImportMsg("Não consegui ler esse arquivo JSON.");
    }
    e.target.value = "";
  }

  function exportGuide() {
    const materias = subjects.map((s) => ({
      nome: s.name,
      assuntos: topics.filter((t) => t.subjectId === s.id).map((t) => ({
        nome: t.name,
        subtopicos: t.subtopics.length ? t.subtopics.map((st) => ({ nome: st.name, status: st.status })) : undefined,
        status: t.subtopics.length ? undefined : t.status,
      })),
    })).filter((m) => m.assuntos.length > 0);
    const blob = new Blob([JSON.stringify({ materias }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "guia-de-estudos.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function copyFormat() {
    if (navigator.clipboard) navigator.clipboard.writeText(GUIDE_JSON_EXAMPLE);
  }

  const searchLower = search.trim().toLowerCase();
  const isSearching = searchLower.length > 0;
  function subjectNameMatches(s) { return s.name.toLowerCase().includes(searchLower); }
  function topicMatches(t) {
    if (t.name.toLowerCase().includes(searchLower)) return true;
    return (t.subtopics || []).some((st) => st.name.toLowerCase().includes(searchLower));
  }

  const visibleSubjects = subjects.filter((s) => {
    if (!isSearching) return true;
    if (subjectNameMatches(s)) return true;
    return topics.some((t) => t.subjectId === s.id && topicMatches(t));
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 15 }}>🔍</span>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar matéria, assunto ou sub-tópico..." style={{ ...input, flex: 1 }} />
          {isSearching && <button onClick={() => setSearch("")} style={iconBtn} aria-label="Limpar busca">×</button>}
        </div>
      </Card>

      {isSearching && visibleSubjects.length === 0 && (
        <Card><EmptyRow text={`Nada encontrado para "${search}".`} /></Card>
      )}

      {visibleSubjects.map((s) => {
        const allTopics = topics.filter((t) => t.subjectId === s.id);
        const subjTopics = isSearching && !subjectNameMatches(s) ? allTopics.filter(topicMatches) : allTopics;
        const pct = subjectCompletionPct(s.id, topics);
        const isCollapsed = isSearching ? false : (collapsed[s.id] === undefined ? true : collapsed[s.id]);
        return (
          <Card key={s.id}>
            <button onClick={() => toggleCollapsed(s.id)} style={{
              background: "transparent", border: "none", padding: 0, cursor: "pointer", width: "100%",
              display: "flex", alignItems: "center", gap: 8, marginBottom: isCollapsed ? 0 : 8, minHeight: "auto",
            }}>
              <span style={{ fontSize: 11, color: "var(--muted)", width: 12, display: "inline-block" }}>{isCollapsed ? "▶" : "▼"}</span>
              <SubjectMark subject={s} size={11} />
              <span style={{ fontSize: 14, fontWeight: 700, flex: 1, textAlign: "left", color: s.color }}>{s.name}</span>
              {allTopics.length > 0 && <span style={{ fontSize: 11.5, color: "var(--muted)" }}>{allTopics.length} assunto{allTopics.length === 1 ? "" : "s"}</span>}
              {pct !== null && <span style={{ fontSize: 12, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>{pct}%</span>}
            </button>
            {isCollapsed && pct !== null && (
              <div style={{ height: 5, background: "var(--surface2)", borderRadius: 4, overflow: "hidden", marginTop: 8 }}>
                <div style={{ width: `${pct}%`, height: "100%", background: s.color, borderRadius: 4 }} />
              </div>
            )}
            {!isCollapsed && (
              <React.Fragment>
                {pct !== null && (
                  <div style={{ height: 6, background: "var(--surface2)", borderRadius: 4, overflow: "hidden", marginBottom: 10 }}>
                    <div style={{ width: `${pct}%`, height: "100%", background: s.color, borderRadius: 4 }} />
                  </div>
                )}
                {subjTopics.length === 0 ? (
                  <div style={{ fontSize: 12.5, color: "var(--muted)" }}>Nenhum assunto cadastrado ainda.</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {subjTopics.map((t) => {
                      const hasSubtopics = t.subtopics && t.subtopics.length > 0;
                      const tCollapsed = isSearching ? false : (collapsedTopics[t.id] === undefined ? true : collapsedTopics[t.id]);
                      const showBody = !hasSubtopics || !tCollapsed;
                      return (
                        <div key={t.id} style={{ border: "1px solid var(--line)", borderRadius: 8, padding: 10 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            {hasSubtopics && (
                              <button onClick={() => toggleTopicCollapsed(t.id)} style={{ background: "transparent", border: "none", cursor: "pointer", minHeight: "auto", padding: 0, fontSize: 10, color: "var(--muted)", width: 12 }} aria-label="Expandir/recolher sub-tópicos">
                                {tCollapsed ? "▶" : "▼"}
                              </button>
                            )}
                            <span style={{ fontSize: 13, flex: 1 }}>{t.name}</span>
                            {!hasSubtopics && <StatusPill status={t.status} onClick={() => cycleTopicStatus(t.id)} />}
                            {hasSubtopics && <span style={{ fontSize: 11, color: "var(--muted)" }}>{t.subtopics.length} sub-tópico{t.subtopics.length === 1 ? "" : "s"}</span>}
                            <button onClick={() => removeTopic(t.id)} style={iconBtn} aria-label="Remover assunto">×</button>
                          </div>
                          {showBody && (
                            <div style={{ marginTop: 8, marginLeft: hasSubtopics ? 18 : 0 }}>
                              {hasSubtopics && (
                                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
                                  {t.subtopics.map((st) => (
                                    <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                      <span style={{ fontSize: 12.5, flex: 1, color: "var(--muted)" }}>· {st.name}</span>
                                      <StatusPill status={st.status} onClick={() => cycleSubtopicStatus(t.id, st.id)} />
                                      <button onClick={() => removeSubtopic(t.id, st.id)} style={iconBtn} aria-label="Remover subtópico">×</button>
                                    </div>
                                  ))}
                                </div>
                              )}
                              <div style={{ display: "flex", gap: 6 }}>
                                <input value={subtopicInputs[t.id] || ""} onChange={(e) => setSubtopicInputs((prev) => ({ ...prev, [t.id]: e.target.value }))}
                                  onKeyDown={(e) => e.key === "Enter" && addSubtopic(t.id)} placeholder="Novo sub-tópico" style={{ ...input, flex: 1, fontSize: 12, padding: "5px 8px" }} />
                                <button onClick={() => addSubtopic(t.id)} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 12 }}>+</button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
                {s.id === subjectId && (
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <input value={topicName} onChange={(e) => setTopicName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTopic()} placeholder="Novo assunto" style={{ ...input, flex: 1 }} />
                    <button onClick={addTopic} style={primaryBtn}>Adicionar</button>
                  </div>
                )}
              </React.Fragment>
            )}
          </Card>
        );
      })}

      {subjects.length === 0 && <Card><EmptyRow text="Cadastre uma matéria primeiro." /></Card>}
      {subjects.length > 0 && (
        <Card>
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 6 }}>Adicionar assunto em qual matéria?</div>
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Card>
      )}

      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar guia via JSON</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
          Peça pra uma IA gerar sua grade de assuntos nesse formato e cole ou suba o arquivo aqui — matérias novas são
          criadas automaticamente.
        </div>
        <textarea value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder="Cole aqui o JSON gerado pela IA..."
          style={{ ...input, width: "100%", height: 100, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          <button onClick={importPasted} style={primaryBtn} disabled={!pasteText.trim()}>Importar texto colado</button>
          <label style={{ ...ghostBtn, display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
            Importar arquivo .json
            <input type="file" accept=".json" onChange={importFile} style={{ display: "none" }} />
          </label>
          <button onClick={exportGuide} style={ghostBtn}>Exportar guia atual</button>
        </div>
        {importMsg && <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>{importMsg}</div>}
        <button onClick={() => setShowFormat((v) => !v)} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px" }}>
          {showFormat ? "Ocultar formato esperado" : "Ver formato esperado"}
        </button>
        {showFormat && (
          <div style={{ marginTop: 8 }}>
            <pre style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, padding: 10, fontSize: 11, overflowX: "auto", fontFamily: "'JetBrains Mono', monospace" }}>{GUIDE_JSON_EXAMPLE}</pre>
            <button onClick={copyFormat} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px", marginTop: 6 }}>Copiar formato (pra colar no prompt da IA)</button>
          </div>
        )}
      </Card>
    </div>
  );
}

// ---------- Caderno de anotações ----------
const NOTE_COLORS = ["#E8A33D", "#4FB4A8", "#C4677D", "#7C9BC2", "#8FBF5F", "#B58AD9", "#D9A0E0", "#5FA8D3"];

// ---------- Caderno de anotações ----------
const NOTE_DRAW_W = 900;
const NOTE_DRAW_H = 520;

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function stripHtml(h) {
  return String(h == null ? "" : h).replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ");
}
function notePlainText(n) {
  if (n.rich && n.contentHtml) return stripHtml(n.contentHtml);
  return n.content || "";
}

const WORLD_W = 900, WORLD_H = 520;

function migratePageItems(drawings) {
  const arr = (drawings || []).map((d) => (d.k ? { ...d } : { ...d, k: "s" }));
  if (!arr.length || (arr[0] && arr[0].world)) return arr;
  return arr.map((it) => {
    if (it.k === "t") return { ...it, x: it.x * 900, y: it.y * 520, size: (it.size || 15) * 1.5, world: true };
    if (it.k === "img") return { ...it, x: it.x * 900, y: it.y * 520, w: it.w * 900, h: it.h * 520, world: true };
    if (it.k === "g") return { ...it, p1: [it.p1[0] * 900, it.p1[1] * 520], p2: [it.p2[0] * 900, it.p2[1] * 520], width: (it.width || 3) * 1.5, world: true };
    return { ...it, points: (it.points || []).map((p) => [p[0] * 900, p[1] * 520]), width: (it.width || 3) * 1.5, world: true };
  });
}

function drawNoteStroke(ctx, st) {
  const pts = st.points || [];
  if (!pts.length) return;
  ctx.save();
  ctx.strokeStyle = st.color || "#E8A33D";
  ctx.fillStyle = st.color || "#E8A33D";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  if (st.kind === "mark") {
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = (st.width || 4) * 4;
  } else {
    ctx.lineWidth = st.width || 4;
  }
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  if (pts.length === 1) {
    ctx.beginPath();
    ctx.arc(pts[0][0], pts[0][1], (st.width || 4) / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.stroke();
  }
  ctx.restore();
}

function drawPageBgWorld(ctx, bg, cam, viewW, viewH, zoom) {
  if (!bg || bg === "none") return;
  const step = 44;
  const x0 = Math.floor(cam.x / step) * step, x1 = cam.x + viewW / zoom;
  const y0 = Math.floor(cam.y / step) * step, y1 = cam.y + viewH / zoom;
  ctx.save();
  if (bg === "dots") {
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    for (let x = x0 + step / 2; x < x1; x += step) {
      for (let y = y0 + step / 2; y < y1; y += step) {
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else {
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 1 / zoom;
    ctx.beginPath();
    for (let y = y0 + step / 2; y < y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    if (bg === "grid") {
      for (let x = x0 + step / 2; x < x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    }
    ctx.stroke();
  }
  ctx.restore();
}

function triVertices(it) {
  const [x1, y1] = it.p1, [x2, y2] = it.p2;
  const xa = Math.min(x1, x2), xb = Math.max(x1, x2);
  const ya = Math.min(y1, y2), yb = Math.max(y1, y2);
  return { A: [xa, yb], B: [xb, yb], C: [xa, ya] };
}

function starPoints(cx, cy, rx, ry) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 1 : 0.45;
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push([cx + rx * r * Math.cos(a), cy + ry * r * Math.sin(a)]);
  }
  return pts;
}
function hexPoints(cx, cy, rx, ry) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 3;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}

function arrowHead(ctx, x, y, ang, size) {
  [Math.PI - 0.42, Math.PI + 0.42].forEach((off) => {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + size * Math.cos(ang + off), y + size * Math.sin(ang + off));
    ctx.stroke();
  });
}

function drawNoteShape(ctx, it) {
  const X = (v) => v, Y = (v) => v;
  ctx.save();
  ctx.strokeStyle = it.color || "#E8A33D";
  ctx.fillStyle = it.color || "#E8A33D";
  ctx.lineWidth = it.width || 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const [x1, y1] = it.p1, [x2, y2] = it.p2;
  if (it.shape === "line" || it.shape === "arrow" || it.shape === "dblarrow") {
    ctx.beginPath();
    ctx.moveTo(X(x1), Y(y1));
    ctx.lineTo(X(x2), Y(y2));
    ctx.stroke();
    const head = Math.max(15, (it.width || 4) * 4);
    const ang = Math.atan2(Y(y2) - Y(y1), X(x2) - X(x1));
    arrowHead(ctx, X(x2), Y(y2), ang, head);
    if (it.shape === "dblarrow") arrowHead(ctx, X(x1), Y(y1), ang + Math.PI, head);
  } else if (it.shape === "rect") {
    ctx.strokeRect(X(x1), Y(y1), X(x2) - X(x1), Y(y2) - Y(y1));
  } else if (it.shape === "circle") {
    ctx.beginPath();
    ctx.ellipse((X(x1) + X(x2)) / 2, (Y(y1) + Y(y2)) / 2, Math.abs(X(x2) - X(x1)) / 2 || 1, Math.abs(Y(y2) - Y(y1)) / 2 || 1, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else if (it.shape === "star" || it.shape === "hex") {
    const cx = (X(x1) + X(x2)) / 2, cy = (Y(y1) + Y(y2)) / 2;
    const rx = Math.abs(X(x2) - X(x1)) / 2 || 1, ry = Math.abs(Y(y2) - Y(y1)) / 2 || 1;
    const pts = it.shape === "star" ? starPoints(cx, cy, rx, ry) : hexPoints(cx, cy, rx, ry);
    ctx.beginPath();
    pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.closePath();
    ctx.stroke();
  } else if (it.shape === "tri") {
    const { A, B, C } = triVertices(it);
    ctx.beginPath();
    ctx.moveTo(X(A[0]), Y(A[1]));
    ctx.lineTo(X(B[0]), Y(B[1]));
    ctx.lineTo(X(C[0]), Y(C[1]));
    ctx.closePath();
    ctx.stroke();
    const s = 22;
    ctx.beginPath();
    ctx.moveTo(X(A[0]) + s, Y(A[1]));
    ctx.lineTo(X(A[0]) + s, Y(A[1]) - s);
    ctx.lineTo(X(A[0]), Y(A[1]) - s);
    ctx.stroke();
    const L = it.labels || {};
    ctx.font = "600 20px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const marks = [
      { t: L.cat1, x: (X(A[0]) + X(B[0])) / 2, y: (Y(A[1]) + Y(B[1])) / 2 + s },
      { t: L.cat2, x: (X(A[0]) + X(C[0])) / 2 - s, y: (Y(A[1]) + Y(C[1])) / 2 },
      { t: L.hip, x: (X(B[0]) + X(C[0])) / 2 + s * 0.6, y: (Y(B[1]) + Y(C[1])) / 2 - s * 0.4 },
    ];
    marks.forEach((m) => {
      if (m.t === undefined || m.t === null || String(m.t).trim() === "") return;
      const txt = String(m.t);
      const w = ctx.measureText(txt).width + 12;
      const h = 30;
      ctx.fillStyle = "rgba(10,13,16,0.85)";
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(m.x - w / 2, m.y - h / 2, w, h, 6);
        ctx.fill();
      } else {
        ctx.fillRect(m.x - w / 2, m.y - h / 2, w, h);
      }
      ctx.fillStyle = it.color || "#E8A33D";
      ctx.fillText(txt, m.x, m.y + 1);
    });
  }
  ctx.restore();
}

function drawNoteText(ctx, it) {
  const size = it.size || 22;
  ctx.save();
  ctx.font = `600 ${size}px Inter, sans-serif`;
  ctx.fillStyle = it.color || "#E9EDF1";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  const lines = String(it.text || "").split("\n");
  const lh = size * 1.35;
  lines.forEach((ln, i) => ctx.fillText(ln, it.x, it.y + i * lh));
  ctx.restore();
}

function drawNoteImage(ctx, it, img) {
  if (!img || !img.complete || !img.naturalWidth) return;
  ctx.save();
  ctx.drawImage(img, it.x, it.y, it.w, it.h);
  ctx.restore();
}

function drawNoteItem(ctx, it, imgCache, onImgLoad) {
  if (!it) return;
  if (it.k === "t") { drawNoteText(ctx, it); return; }
  if (it.k === "img") {
    if (it.animated) return;
    let img = imgCache[it.dataUrl];
    if (!img) {
      img = new Image();
      imgCache[it.dataUrl] = img;
      if (onImgLoad) img.onload = onImgLoad;
      img.src = it.dataUrl;
      return;
    }
    drawNoteImage(ctx, it, img);
    return;
  }
  if (it.k === "g") { drawNoteShape(ctx, it); return; }
  drawNoteStroke(ctx, it);
}

function noteItemsOf(drawings) {
  return migratePageItems(drawings);
}

function distPtSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function pointInTri(px, py, A, B, C) {
  const d = (p, a, b) => (p[0] - b[0]) * (a[1] - b[1]) - (a[0] - b[0]) * (p[1] - b[1]);
  const p = [px, py];
  const d1 = d(p, A, B), d2 = d(p, B, C), d3 = d(p, C, A);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);
}

function hitNoteItem(ctx, it, wx, wy, zoom) {
  const T = 16 / Math.max(0.3, zoom || 1);
  if (it.k === "t") {
    const size = it.size || 22;
    ctx.save();
    ctx.font = `600 ${size}px Inter, sans-serif`;
    const lines = String(it.text || "").split("\n");
    const w = Math.max.apply(null, [60].concat(lines.map((ln) => ctx.measureText(ln).width)));
    ctx.restore();
    const h = lines.length * size * 1.35;
    return wx >= it.x - 8 && wx <= it.x + w + 8 && wy >= it.y - 8 && wy <= it.y + h + 8;
  }
  if (it.k === "img") {
    return wx >= it.x && wx <= it.x + it.w && wy >= it.y && wy <= it.y + it.h;
  }
  if (it.k === "g") {
    const [x1, y1] = it.p1, [x2, y2] = it.p2;
    if (it.shape === "line" || it.shape === "arrow" || it.shape === "dblarrow") {
      return distPtSeg(wx, wy, x1, y1, x2, y2) < T;
    }
    const xa = Math.min(x1, x2) - 8, xb = Math.max(x1, x2) + 8;
    const ya = Math.min(y1, y2) - 8, yb = Math.max(y1, y2) + 8;
    if (it.shape === "tri") {
      const { A, B, C } = triVertices(it);
      if (pointInTri(wx, wy, A, B, C)) return true;
    }
    return wx >= xa && wx <= xb && wy >= ya && wy <= yb;
  }
  return (it.points || []).some((p) => Math.hypot(p[0] - wx, p[1] - wy) < T);
}

function moveNoteItem(it, dx, dy) {
  const sh = (p) => [p[0] + dx, p[1] + dy];
  if (it.k === "t" || it.k === "img") return { ...it, x: it.x + dx, y: it.y + dy };
  if (it.k === "g") return { ...it, p1: sh(it.p1), p2: sh(it.p2) };
  return { ...it, points: (it.points || []).map(sh) };
}

function applyWorldTransform(ctx, cam, zoom, dpr) {
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -cam.x * dpr * zoom, -cam.y * dpr * zoom);
}

function paintWorldItems(ctx, items, bg, cam, zoom, viewW, viewH, dpr, imgCache, onLoad) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, Math.round(viewW * dpr), Math.round(viewH * dpr));
  applyWorldTransform(ctx, cam, zoom, dpr);
  drawPageBgWorld(ctx, bg, cam, viewW, viewH, zoom);
  items.forEach((it) => {
    if (it.k === "img" && it.animated) return;
    drawNoteItem(ctx, it, imgCache, onLoad);
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function itemsBBox(items) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  function eat(x, y) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  items.forEach((it) => {
    if (it.k === "t") { eat(it.x, it.y); eat(it.x + 220, it.y + (it.size || 22) * 1.6); }
    else if (it.k === "img") { eat(it.x, it.y); eat(it.x + it.w, it.y + it.h); }
    else if (it.k === "g") { eat(it.p1[0], it.p1[1]); eat(it.p2[0], it.p2[1]); }
    else (it.points || []).forEach((p) => eat(p[0], p[1]));
  });
  if (x0 === Infinity) return null;
  const pad = 40;
  return { x: x0 - pad, y: y0 - pad, w: (x1 - x0) + pad * 2, h: (y1 - y0) + pad * 2 };
}
function fitCamFor(viewW, viewH, items) {
  const bb = itemsBBox(items);
  const region = bb || { x: -40, y: -40, w: WORLD_W + 80, h: WORLD_H + 80 };
  const zoom = Math.min(viewW / region.w, viewH / region.h, 3);
  return { x: region.x + region.w / 2 - viewW / zoom / 2, y: region.y + region.h / 2 - viewH / zoom / 2, zoom };
}

function NoteDrawingView({ strokes, bg }) {
  const ref = useRef(null);
  const cache = useRef({});
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const items = migratePageItems(strokes);
    const ctx = canvas.getContext("2d");
    const paint = () => {
      const bb = itemsBBox(items);
      const region = bb || { x: -40, y: -40, w: WORLD_W + 80, h: WORLD_H + 80 };
      const zoom = Math.min(canvas.width / region.w, canvas.height / region.h, 2.5);
      const cam = { x: region.x + region.w / 2 - canvas.width / zoom / 2, y: region.y + region.h / 2 - canvas.height / zoom / 2 };
      paintWorldItems(ctx, items, bg, cam, zoom, canvas.width, canvas.height, 1, cache.current, paint);
    };
    paint();
  }, [strokes, bg]);
  const items = migratePageItems(strokes);
  if (!items.length && (!bg || bg === "none")) return null;
  const anims = items.filter((it) => it.k === "img" && it.animated);
  const bb = itemsBBox(items);
  const region = bb || { x: -40, y: -40, w: WORLD_W + 80, h: WORLD_H + 80 };
  const zoom = Math.min(900 / region.w, 520 / region.h, 2.5);
  const cam = { x: region.x + region.w / 2 - 900 / zoom / 2, y: region.y + region.h / 2 - 520 / zoom / 2 };
  return (
    <div style={{ position: "relative", marginTop: 8 }}>
      <canvas ref={ref} width={NOTE_DRAW_W} height={NOTE_DRAW_H} style={{ width: "100%", display: "block", borderRadius: 6, background: "rgba(0,0,0,0.18)", border: "1px solid var(--line)" }} />
      {anims.map((it) => {
        const st = {
          position: "absolute",
          left: (((it.x - cam.x) * zoom) / 900 * 100) + "%",
          top: (((it.y - cam.y) * zoom) / 520 * 100) + "%",
          width: ((it.w * zoom) / 900 * 100) + "%",
          height: ((it.h * zoom) / 520 * 100) + "%",
          objectFit: "fill",
          borderRadius: 4,
        };
        return it.mime && it.mime.startsWith("video/") ? (
          <video key={it.id} src={it.dataUrl} autoPlay loop muted playsInline ref={(el) => { if (el) el.muted = true; }} style={st} />
        ) : (
          <img key={it.id} src={it.dataUrl} draggable={false} style={st} alt="" />
        );
      })}
    </div>
  );
}

const NOTE_PAGE_TOOLS = [
  { id: "move", label: "🖱️ Mover" },
  { id: "pen", label: "✏️ Caneta" },
  { id: "mark", label: "🖍️ Marca-texto" },
  { id: "erase", label: "🧹 Borracha" },
  { id: "text", label: "🔤 Texto" },

];
const NOTE_SHAPES = [
  { id: "line", label: "📏 Linha" },
  { id: "arrow", label: "➡️ Seta" },
  { id: "dblarrow", label: "↔️ Seta dupla" },
  { id: "rect", label: "▭ Retângulo" },
  { id: "circle", label: "⭕ Círculo" },
  { id: "tri", label: "📐 Triângulo" },

];
const NOTE_PAGE_BGS = [

function NoteEditor({ initialTitle, initialHtml, initialColor, initialDrawings, initialPageBg, onSave, onCancel, saveLabel }) {
  const [title, setTitle] = useState(initialTitle || "");
  const [color, setColor] = useState(initialColor || NOTE_COLORS[0]);
  const [pageTool, setPageTool] = useState("move");
  const [pageShape, setPageShape] = useState("rect");
  const [drawColor, setDrawColor] = useState(initialColor || NOTE_COLORS[0]);
  const [drawWidth, setDrawWidth] = useState(4);
  const [pageBg, setPageBg] = useState(initialPageBg || "none");
  const [items, setItems] = useState(() => migratePageItems(initialDrawings));
  const [hist, setHist] = useState(() => ({ stack: [migratePageItems(initialDrawings)], i: 0 }));
  const [selectedId, setSelectedId] = useState(null);
  const [showPage, setShowPage] = useState(true);
  const [fullPage, setFullPage] = useState(false);
  const [imgMsg, setImgMsg] = useState("");
  const [cam, setCam] = useState({ x: 0, y: 0, zoom: 1 });
  const [viewSize, setViewSize] = useState({ w: 800, h: 320 });
  const editRef = useRef(null);
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const imgCache = useRef({});
  const itemsRef = useRef(items);
  const camRef = useRef(cam);
  const gesture = useRef(null);
  const fileRef = useRef(null);
  const fittedRef = useRef(false);

  const selected = items.find((it) => it.id === selectedId) || null;
  const dpr = Math.min(2, (typeof window !== "undefined" && window.devicePixelRatio) || 1);

  useEffect(() => { itemsRef.current = items; });
  useEffect(() => { camRef.current = cam; });

  // mede a área visível (CSS px) e ajusta o canvas; enquadra a região inicial 1x
  useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    function measure() {
      const r = wrap.getBoundingClientRect();
      const w = Math.max(200, Math.floor(r.width));
      const h = Math.max(200, Math.floor(r.height));
      setViewSize((prev) => (prev.w === w && prev.h === h ? prev : { w, h }));
      if (!fittedRef.current) {
        fittedRef.current = true;
        setCam(fitCamFor(w, h, itemsRef.current));
      }
    }
    measure();
    const t = setTimeout(measure, 120);
    window.addEventListener("resize", measure);
    let ro = null;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(measure);
      ro.observe(wrap);
    }
    return () => { clearTimeout(t); window.removeEventListener("resize", measure); if (ro) ro.disconnect(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showPage, fullPage]);

  function pushHist(next) {
    setHist((h) => ({ stack: [...h.stack.slice(0, h.i + 1), next].slice(-40), i: Math.min(h.i + 1, 39) }));
  }
  function snap() {
    pushHist(itemsRef.current);
  }
  function update(fn, withHist) {
    const next = fn(itemsRef.current);
    itemsRef.current = next;
    setItems(next);
    if (withHist) pushHist(next);
  }
  function undo() {
    setHist((h) => {
      if (h.i <= 0) return h;
      const prev = h.stack[h.i - 1];
      itemsRef.current = prev;
      setItems(prev);
      setSelectedId(null);
      return { ...h, i: h.i - 1 };
    });
  }
  function redo() {
    setHist((h) => {
      if (h.i >= h.stack.length - 1) return h;
      const next = h.stack[h.i + 1];
      itemsRef.current = next;
      setItems(next);
      setSelectedId(null);
      return { ...h, i: h.i + 1 };
    });
  }

  function exec(cmd, val) {
    try {
      editRef.current && editRef.current.focus();
      if (cmd === "hiliteColor") {
        if (!document.execCommand("hiliteColor", false, val)) document.execCommand("backColor", false, val);
      } else {
        document.execCommand(cmd, false, val == null ? null : val);
      }
    } catch (e) {}
  }
  function keepFocus(e) { e.preventDefault(); }
  function fmtBtn(label, title, onClick) {
    return (
      <button
        onMouseDown={keepFocus}
        onClick={onClick}
        title={title}
        style={{ ...ghostBtn, padding: "4px 9px", fontSize: 13, minHeight: "auto", fontWeight: 700 }}
      >
        {label}
      </button>
    );
  }

  function redraw() {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const c = camRef.current;
    paintWorldItems(ctx, itemsRef.current, pageBg, c, c.zoom, viewSize.w, viewSize.h, dpr, imgCache.current, redraw);
    const sel = itemsRef.current.find((it) => it.id === selectedId);
    if (sel) {
      ctx.save();
      applyWorldTransform(ctx, c, c.zoom, dpr);
      ctx.strokeStyle = "#E9EDF1";
      ctx.setLineDash([8 / c.zoom, 6 / c.zoom]);
      ctx.lineWidth = 2 / c.zoom;
      const pad = 8;
      if (sel.k === "t") {
        const size = sel.size || 22;
        ctx.font = `600 ${size}px Inter, sans-serif`;
        const lines = String(sel.text || "").split("\n");
        const w = Math.max.apply(null, [60].concat(lines.map((ln) => ctx.measureText(ln).width)));
        const h = lines.length * size * 1.35;
        ctx.strokeRect(sel.x - pad, sel.y - pad, w + pad * 2, h + pad * 2);
      } else if (sel.k === "img") {
        ctx.strokeRect(sel.x - pad, sel.y - pad, sel.w + pad * 2, sel.h + pad * 2);
      } else if (sel.k === "g") {
        const [x1, y1] = sel.p1, [x2, y2] = sel.p2;
        ctx.strokeRect(Math.min(x1, x2) - pad, Math.min(y1, y2) - pad, Math.abs(x2 - x1) + pad * 2, Math.abs(y2 - y1) + pad * 2);
      } else if ((sel.points || []).length) {
        const xs = sel.points.map((p) => p[0]);
        const ys = sel.points.map((p) => p[1]);
        ctx.strokeRect(Math.min.apply(null, xs) - pad, Math.min.apply(null, ys) - pad, Math.max.apply(null, xs) - Math.min.apply(null, xs) + pad * 2, Math.max.apply(null, ys) - Math.min.apply(null, ys) + pad * 2);
      }
      ctx.restore();
    }
    if (gesture.current && gesture.current.temp) {
      const t = gesture.current.temp;
      ctx.save();
      applyWorldTransform(ctx, c, c.zoom, dpr);
      if (t.shape) drawNoteShape(ctx, { shape: t.shape, color: drawColor, width: drawWidth, p1: t.p1, p2: t.p2, labels: {} });
      else if (t.points) drawNoteStroke(ctx, { kind: t.kind, color: drawColor, width: drawWidth, points: t.points });
      ctx.restore();
    }
  }

  useEffect(() => { if (showPage) redraw(); });

  function toWorld(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
    const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
    const c = camRef.current;
    return { x: c.x + (cx - rect.left) / c.zoom, y: c.y + (cy - rect.top) / c.zoom };
  }

  function hitTop(wx, wy) {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const arr = itemsRef.current;
    for (let i = arr.length - 1; i >= 0; i--) {
      const it = arr[i];
      if (it.k === "img" && it.animated) continue;
      if (hitNoteItem(ctx, it, wx, wy, camRef.current.zoom)) return it;
    }
    return null;
  }

  function zoomAt(clientX, clientY, factor) {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    setCam((prev) => {
      const nz = Math.max(0.15, Math.min(6, prev.zoom * factor));
      const wx = prev.x + mx / prev.zoom, wy = prev.y + my / prev.zoom;
      return { x: wx - mx / nz, y: wy - my / nz, zoom: nz };
    });
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !showPage) return;
    function onWheel(e) {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
    }
    canvas.addEventListener("wheel", onWheel, { passive: false });
    return () => canvas.removeEventListener("wheel", onWheel);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showPage, fullPage]);

  function pageDown(e) {
    if (e.button !== undefined && e.button === 1) return;
    e.preventDefault();
    const { x: wx, y: wy } = toWorld(e);
    if (pageTool === "move") {
      const hit = hitTop(wx, wy);
      setSelectedId(hit ? hit.id : null);
      if (hit) gesture.current = { moving: hit.id, last: [wx, wy] };
      else gesture.current = { panning: true, last: [wx, wy] };
      return;
    }
    if (pageTool === "text") {
      const it = { id: uid(), k: "t", x: wx, y: wy, text: "Texto", color: drawColor, size: 22, world: true };
      update((prev) => [...prev, it], true);
      setSelectedId(it.id);
      setPageTool("move");
      return;
    }
    if (pageTool === "erase") {
      snap();
      gesture.current = { erasing: true };
      eraseAt(wx, wy);
      return;
    }
    if (pageTool === "shape") {
      gesture.current = { shaping: true, start: [wx, wy], cur: [wx, wy] };
      gesture.current.temp = { shape: pageShape, p1: [wx, wy], p2: [wx, wy] };
      redraw();
      return;
    }
    gesture.current = { drawing: true, kind: pageTool, points: [[wx, wy]] };
  }
  function pageMove(e) {
    if (!gesture.current) return;
    e.preventDefault();
    const { x: wx, y: wy } = toWorld(e);
    const g = gesture.current;
    if (g.erasing) {
      eraseAt(wx, wy);
      return;
    }
    if (g.panning) {
      const dx = wx - g.last[0], dy = wy - g.last[1];
      g.last = [wx, wy];
      setCam((prev) => ({ ...prev, x: prev.x - dx, y: prev.y - dy }));
      return;
    }
    if (g.moving) {
      const dx = wx - g.last[0], dy = wy - g.last[1];
      g.last = [wx, wy];
      update((prev) => prev.map((it) => (it.id === g.moving ? moveNoteItem(it, dx, dy) : it)), false);
      return;
    }
    if (g.shaping) {
      g.cur = [wx, wy];
      g.temp = { shape: pageShape, p1: g.start, p2: [wx, wy] };
      redraw();
      return;
    }
    if (g.drawing) {
      const last = g.points[g.points.length - 1];
      const dx = wx - last[0], dy = wy - last[1];
      const z = camRef.current.zoom;
      if ((dx * dx + dy * dy) * z * z < 4) return;
      g.points.push([wx, wy]);
      g.temp = { kind: g.kind, points: g.points };
      redraw();
    }
  }
  function pageUp() {
    if (!gesture.current) return;
    const g = gesture.current;
    gesture.current = null;
    if (g.drawing && g.points.length > 0) {
      update((prev) => [...prev, { id: uid(), k: "s", kind: g.kind, color: drawColor, width: drawWidth, points: g.points, world: true }], true);
    } else if (g.shaping) {
      const [sx, sy] = g.start;
      const [ex, ey] = g.cur || g.start;
      if (Math.hypot(ex - sx, ey - sy) < 10) { redraw(); return; }
      const it = { id: uid(), k: "g", shape: pageShape, color: drawColor, width: drawWidth, p1: [sx, sy], p2: [ex, ey], world: true };
      if (pageShape === "tri") it.labels = { cat1: "", cat2: "", hip: "" };
      update((prev) => [...prev, it], true);
      setSelectedId(it.id);
      setPageTool("move");
    } else {
      redraw();
    }
  }

  function eraseAt(wx, wy) {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    update((prev) => {
      const kept = prev.filter((it) => {
        if (it.k === "t" || it.k === "img") return true;
        return !hitNoteItem(ctx, it, wx, wy, camRef.current.zoom);
      });
      return kept.length === prev.length ? prev : kept;
    }, false);
  }

  function deleteSelected() {
    if (!selectedId) return;
    update((prev) => prev.filter((it) => it.id !== selectedId), true);
    setSelectedId(null);
  }
  function duplicateSelected() {
    if (!selectedId) return;
    const src = itemsRef.current.find((it) => it.id === selectedId);
    if (!src) return;
    const copy = JSON.parse(JSON.stringify({ ...src, id: uid() }));
    const moved = moveNoteItem(copy, 30, 30);
    update((prev) => [...prev, moved], true);
    setSelectedId(moved.id);
  }
  function orderSelected(front) {
    if (!selectedId) return;
    update((prev) => {
      const rest = prev.filter((it) => it.id !== selectedId);
      const sel = prev.find((it) => it.id === selectedId);
      return front ? [...rest, sel] : [sel, ...rest];
    }, true);
  }
  function patchSelected(patch) {
    if (!selectedId) return;
    update((prev) => prev.map((it) => (it.id === selectedId ? { ...it, ...patch } : it)), false);
  }
  function patchTriLabel(key, val) {
    if (!selectedId) return;
    update((prev) => prev.map((it) => (it.id === selectedId ? { ...it, labels: { ...(it.labels || {}), [key]: val } } : it)), false);
  }
  function clearPage() {
    update(() => [], true);
    setSelectedId(null);
  }

  function animScreenStyle(it) {
    return {
      position: "absolute",
      left: ((it.x - cam.x) * cam.zoom) + "px",
      top: ((it.y - cam.y) * cam.zoom) + "px",
      width: (it.w * cam.zoom) + "px",
      height: (it.h * cam.zoom) + "px",
      objectFit: "fill",
      borderRadius: 4,
      cursor: pageTool === "move" ? "grab" : "default",
      touchAction: "none",
      outline: selectedId === it.id ? "2px dashed #E9EDF1" : "none",
      outlineOffset: 2,
      zIndex: 4,
    };
  }
  function animDown(e, it) {
    e.stopPropagation();
    if (pageTool !== "move") return;
    e.preventDefault();
    setSelectedId(it.id);
    const p = toWorld(e);
    gesture.current = { moving: it.id, last: [p.x, p.y], anim: true };
  }
  function animMove(e) {
    const g = gesture.current;
    if (!g || !g.anim) return;
    e.preventDefault();
    const p = toWorld(e);
    const dx = p.x - g.last[0], dy = p.y - g.last[1];
    g.last = [p.x, p.y];
    update((prev) => prev.map((it) => (it.id === g.moving ? moveNoteItem(it, dx, dy) : it)), false);
  }
  function animUp() {
    if (gesture.current && gesture.current.anim) gesture.current = null;
  }

  function handleImageFile(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImgMsg("");
    const isAnim = file.type === "image/gif" || (file.type || "").startsWith("video/");
    const isImg = (file.type || "").startsWith("image/");
    if (!isImg && !isAnim) { setImgMsg("Esse arquivo não é imagem nem animação."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      if (isAnim) {
        const url = reader.result;
        if (url.length > 2 * 1024 * 1024) { setImgMsg("Animação grande demais (limite ~2MB)."); return; }
        const probe = isImg ? new Image() : document.createElement("video");
        const done = () => {
          const nw = isImg ? (probe.naturalWidth || 320) : (probe.videoWidth || 320);
          const nh = isImg ? (probe.naturalHeight || 240) : (probe.videoHeight || 240);
          const c = camRef.current;
          const targetW = Math.min(420, nw);
          const w = targetW, h = targetW * (nh / Math.max(1, nw));
          const cx = c.x + viewSize.w / c.zoom / 2, cy = c.y + viewSize.h / c.zoom / 2;
          const it = { id: uid(), k: "img", animated: true, mime: file.type, dataUrl: url, x: cx - w / 2, y: cy - h / 2, w, h, world: true };
          update((prev) => [...prev, it], true);
          setSelectedId(it.id);
          setPageTool("move");
        };
        if (isImg) { probe.onload = done; probe.onerror = () => setImgMsg("Não consegui ler essa imagem."); }
        else {
          probe.muted = true;
          probe.onloadedmetadata = done;
          probe.onerror = () => setImgMsg("Não consegui ler esse vídeo.");
        }
        probe.src = url;
        return;
      }
      const img = new Image();
      img.onload = () => {
        const maxDim = 640;
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const cw = document.createElement("canvas");
        cw.width = Math.max(1, Math.round(img.naturalWidth * scale));
        cw.height = Math.max(1, Math.round(img.naturalHeight * scale));
        cw.getContext("2d").drawImage(img, 0, 0, cw.width, cw.height);
        const url = cw.toDataURL("image/jpeg", 0.82);
        if (url.length > 950 * 1024) { setImgMsg("Imagem grande demais mesmo comprimida (limite ~900KB)."); return; }
        const c = camRef.current;
        const w = Math.min(420, cw.width);
        const h = w * (cw.height / Math.max(1, cw.width));
        const cx = c.x + viewSize.w / c.zoom / 2, cy = c.y + viewSize.h / c.zoom / 2;
        const it = { id: uid(), k: "img", dataUrl: url, x: cx - w / 2, y: cy - h / 2, w, h, world: true };
        update((prev) => [...prev, it], true);
        setSelectedId(it.id);
        setPageTool("move");
      };
      img.onerror = () => setImgMsg("Não consegui ler essa imagem.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function save() {
    const el = editRef.current;

function NoteCard({ note, onSave, onRemove, onTogglePin }) {
  const [editing, setEditing] = useState(false);

  function save(data) {
    onSave(note.id, { ...data, updatedAt: new Date().toISOString() });
    setEditing(false);
  }

  if (editing) {
    return (
      <NoteEditor
        initialTitle={note.title}
        initialHtml={note.rich ? (note.contentHtml || "") : escapeHtml(note.content || "")}
        initialColor={note.color || NOTE_COLORS[0]}
        initialDrawings={note.drawings || []}
        initialPageBg={note.pageBg || "none"}
        onSave={save}
        onCancel={() => setEditing(false)}
      />
    );
  }

  return (
    <div style={{ background: "var(--surface2)", borderLeft: `4px solid ${note.color || NOTE_COLORS[0]}`, border: "1px solid var(--line)", borderRadius: 8, padding: 10 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 4 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, flex: 1 }}>{note.pinned && "📌 "}{note.title}</div>
        <button onClick={() => onTogglePin(note.id)} style={iconBtn} aria-label="Fixar/desafixar" title="Fixar">{note.pinned ? "📍" : "📌"}</button>
        <button onClick={() => setEditing(true)} style={iconBtn} aria-label="Editar">✏️</button>
        <button onClick={() => onRemove(note.id)} style={iconBtn} aria-label="Excluir">×</button>
      </div>
      {note.rich && note.contentHtml ? (
        <div dangerouslySetInnerHTML={{ __html: note.contentHtml }} style={{ fontSize: 12.5, color: "var(--text)", lineHeight: 1.55, wordBreak: "break-word" }} />
      ) : (
        <div style={{ fontSize: 12.5, color: "var(--muted)", whiteSpace: "pre-wrap", lineHeight: 1.5 }}>{note.content || "(vazio)"}</div>
      )}
      <NoteDrawingView strokes={note.drawings} bg={note.pageBg} />
    </div>
  );
}

function Caderno({ subjects, notes, setNotes }) {
  const [search, setSearch] = useState("");
  const [collapsed, setCollapsed] = useState({});
  const [addingFor, setAddingFor] = useState(null);

  function toggleCollapsed(id) {
    setCollapsed((prev) => {
      const current = prev[id] === undefined ? true : prev[id];
      return { ...prev, [id]: !current };
    });
  }

  function startAdd(subjectId) {
    setAddingFor(subjectId);
  }
  function saveNew(data) {
    setNotes((prev) => [{
      id: uid(), subjectId: addingFor, title: data.title, contentHtml: data.contentHtml, content: data.content,
      rich: true, color: data.color, drawings: data.drawings, pageBg: data.pageBg,
      pinned: false, updatedAt: new Date().toISOString(),
    }, ...prev]);
    setAddingFor(null);
  }
  function updateNote(id, patch) { setNotes((prev) => prev.map((n) => (n.id === id ? { ...n, ...patch } : n))); }
  function removeNote(id) { setNotes((prev) => prev.filter((n) => n.id !== id)); }
  function togglePin(id) { setNotes((prev) => prev.map((n) => (n.id === id ? { ...n, pinned: !n.pinned } : n))); }

  const searchLower = search.trim().toLowerCase();
  const isSearching = searchLower.length > 0;
  function noteMatches(n) {
    const hay = (n.title + " " + notePlainText(n)).toLowerCase();
    return hay.includes(searchLower);
  }

  const visibleSubjects = subjects.filter((s) => {
    if (!isSearching) return true;
    return notes.some((n) => n.subjectId === s.id && noteMatches(n));
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 15 }}>🔍</span>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar nas anotações..." style={{ ...input, flex: 1 }} />
          {isSearching && <button onClick={() => setSearch("")} style={iconBtn} aria-label="Limpar busca">×</button>}
        </div>
      </Card>

      {subjects.length === 0 && <Card><EmptyRow text="Cadastre uma matéria primeiro." /></Card>}
      {isSearching && visibleSubjects.length === 0 && <Card><EmptyRow text={`Nada encontrado para "${search}".`} /></Card>}

      {visibleSubjects.map((s) => {
        const subjNotesAll = notes.filter((n) => n.subjectId === s.id);
        const subjNotes = isSearching ? subjNotesAll.filter(noteMatches) : subjNotesAll;
        const sorted = [...subjNotes].sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt || "").localeCompare(a.updatedAt || ""));
        const isCollapsed = isSearching ? false : (collapsed[s.id] === undefined ? true : collapsed[s.id]);

        return (
          <Card key={s.id}>
            <button onClick={() => toggleCollapsed(s.id)} style={{
              background: "transparent", border: "none", padding: 0, cursor: "pointer", width: "100%",
              display: "flex", alignItems: "center", gap: 8, marginBottom: isCollapsed ? 0 : 10, minHeight: "auto",
            }}>
              <span style={{ fontSize: 11, color: "var(--muted)", width: 12 }}>{isCollapsed ? "▶" : "▼"}</span>
              <SubjectMark subject={s} size={11} />
              <span style={{ fontSize: 14, fontWeight: 700, flex: 1, textAlign: "left", color: s.color }}>{s.name}</span>
              {subjNotesAll.length > 0 && <span style={{ fontSize: 11.5, color: "var(--muted)" }}>{subjNotesAll.length} anotação{subjNotesAll.length === 1 ? "" : "ões"}</span>}
            </button>

            {!isCollapsed && (
              <React.Fragment>
                {sorted.length === 0 ? (
                  <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10 }}>Nenhuma anotação ainda nessa matéria.</div>
                ) : (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 8, marginBottom: 10 }}>
                    {sorted.map((n) => (
                      <NoteCard key={n.id} note={n} onSave={updateNote} onRemove={removeNote} onTogglePin={togglePin} />
                    ))}
                  </div>
                )}

                {addingFor === s.id ? (
                  <NoteEditor
                    initialTitle=""
                    initialHtml=""
                    initialColor={NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)]}
                    initialDrawings={[]}
                    onSave={saveNew}
                    onCancel={() => setAddingFor(null)}
                  />
                ) : (
                  <button onClick={() => startAdd(s.id)} style={ghostBtn}>+ Nova anotação</button>
                )}
              </React.Fragment>
            )}
          </Card>
        );
      })}
    </div>
  );
}

function Cronometro({ subjects, sessions, setSessions, timerSound, statusRef }) {
  const [modeId, setModeId] = useState("pomodoro");
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [customMin, setCustomMin] = useState(25);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [note, setNote] = useState("");
  const intervalRef = useRef(null);
  const startRef = useRef(null);
  const accumulatedRef = useRef(0);
  const mode = MODES.find((m) => m.id === modeId);
  const targetSeconds = modeId === "livre" ? 0 : customMin * 60;

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  // timestamp-based ticking avoids drift from throttled background tabs
  useEffect(() => {
    if (running) {
      startRef.current = Date.now();
      intervalRef.current = setInterval(() => {
        setElapsed(accumulatedRef.current + (Date.now() - startRef.current) / 1000);
      }, 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  // navegadores pausam/atrasam o setInterval em segundo plano — ao voltar pra aba,
  // recalcula na hora em vez de esperar o próximo tick (podia parecer "travado")
  useEffect(() => {
    function handleVisible() {
      if (document.visibilityState === "visible" && running && startRef.current) {
        setElapsed(accumulatedRef.current + (Date.now() - startRef.current) / 1000);
      }
    }
    document.addEventListener("visibilitychange", handleVisible);
    return () => document.removeEventListener("visibilitychange", handleVisible);
  }, [running]);

  useEffect(() => {
    if (mode.direction === "down" && running && elapsed >= targetSeconds && targetSeconds > 0) {
      accumulatedRef.current = targetSeconds;
      setElapsed(targetSeconds);
      setRunning(false);
      if (timerSound) playBeep();
    }
  }, [elapsed, running, targetSeconds, mode.direction]);

  const display = mode.direction === "down" ? Math.max(0, targetSeconds - elapsed) : elapsed;
  const progress = mode.direction === "down" && targetSeconds > 0 ? Math.min(1, elapsed / targetSeconds) : 0;
  const finished = mode.direction === "down" && targetSeconds > 0 && elapsed >= targetSeconds;

  function reset() {
    setRunning(false);
    accumulatedRef.current = 0;
    setElapsed(0);
  }
  function pause() {
    accumulatedRef.current = elapsed;
    setRunning(false);
  }
  function finalize() {
    if (elapsed > 0 && subjectId) {
      setSessions((prev) => [{ id: uid(), subjectId, mode: modeId, seconds: Math.round(elapsed), endedAt: new Date().toISOString(), note: note.trim() }, ...prev]);
    }
    setNote(""); reset();
  }

  // ponte com a Agnes: ela só "pede" (via AgnesBubble, que valida a ação com o
  // backend) — quem de fato mexe no cronômetro continua sendo este componente
  useEffect(() => {
    return AgnesBus.subscribe((cmd) => {
      if (cmd.name === "start_timer") {
        if (cmd.args.subject_name) {
          const match = subjects.find((s) => s.name.toLowerCase() === cmd.args.subject_name.toLowerCase());
          if (match) setSubjectId(match.id);
        }
        if (cmd.args.mode) setModeId(cmd.args.mode);
        if (cmd.args.duration_minutes) setCustomMin(cmd.args.duration_minutes);
        setTimeout(() => setRunning(true), 60);
      } else if (cmd.name === "pause_timer") {
        pause();
      } else if (cmd.name === "stop_timer") {
        reset();
      } else if (cmd.name === "select_subject") {
        const match = subjects.find((s) => s.name.toLowerCase() === (cmd.args.subject_name || "").toLowerCase());
        if (match) setSubjectId(match.id);
      }
    });
  }, [subjects, elapsed]);

  const activeSubject = subjects.find((s) => s.id === subjectId);
  // publica o status ao vivo pro Header (pílula ⏱) — o componente continua
  // montado ao trocar de aba, então a contagem não para
  if (statusRef) statusRef.current = { running, text: fmtTime(display), subject: activeSubject ? activeSubject.name : "" };
  const size = 220, stroke = 10, r = (size - stroke) / 2, circ = 2 * Math.PI * r;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, alignItems: "center" }}>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center" }}>
        {MODES.map((m) => (
          <button key={m.id} onClick={() => { if (!running) { setModeId(m.id); reset(); } }} style={{
            ...ghostBtn, background: modeId === m.id ? "var(--accent)" : "transparent", color: modeId === m.id ? "#14181C" : "var(--muted)",
            borderColor: modeId === m.id ? "var(--accent)" : "var(--line)", fontWeight: modeId === m.id ? 700 : 500,
          }}>{m.label}</button>
        ))}
      </div>

      {mode.direction === "down" && !running && elapsed === 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--muted)" }}>
          <span>Duração:</span>
          <input type="number" min={1} max={240} value={customMin} onChange={(e) => setCustomMin(Number(e.target.value) || 1)} style={{ ...input, width: 64, textAlign: "center" }} />
          <span>min</span>
        </div>
      )}

      <div style={{ position: "relative", width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} stroke="var(--surface2)" strokeWidth={stroke} fill="none" />
          {mode.direction === "down" && targetSeconds > 0 && (
            <circle cx={size / 2} cy={size / 2} r={r} stroke={finished ? "var(--accent2)" : "var(--accent)"} strokeWidth={stroke} fill="none"
              strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s linear" }} />
          )}
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 40, fontWeight: 700, letterSpacing: "-0.02em" }}>{fmtTime(display)}</div>
          {activeSubject && <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--muted)" }}><SubjectMark subject={activeSubject} /> {activeSubject.name}</div>}
          {finished && <div style={{ fontSize: 12, color: "var(--accent2)", fontWeight: 600 }}>Concluído</div>}
        </div>
      </div>

      <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={{ ...input, width: 200 }} disabled={running}>
        {subjects.length === 0 && <option value="">Cadastre uma matéria</option>}
        {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>

      <div style={{ display: "flex", gap: 8 }}>
        {!running ? (
          <button onClick={() => setRunning(true)} style={primaryBtn} disabled={!subjectId || finished}>{elapsed > 0 ? "Retomar" : "Iniciar"}</button>
        ) : (
          <button onClick={pause} style={ghostBtn}>Pausar</button>
        )}
        <button onClick={finalize} style={ghostBtn} disabled={elapsed === 0}>Finalizar sessão</button>
      </div>

      {elapsed > 0 && <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Nota da sessão (opcional)" style={{ ...input, width: "100%", maxWidth: 340 }} />}

      <VideoLessonForm subjects={subjects} setSessions={setSessions} />
    </div>
  );
}

function VideoLessonForm({ subjects, setSessions }) {
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [title, setTitle] = useState("");
  const [link, setLink] = useState("");
  const [minutes, setMinutes] = useState(30);
  const [saved, setSaved] = useState(false);

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  function save() {
    if (!subjectId || !link.trim() || minutes <= 0) return;
    setSessions((prev) => [{
      id: uid(), subjectId, mode: "video", seconds: minutes * 60, endedAt: new Date().toISOString(),
      note: title.trim() || "Aula em vídeo", link: link.trim(),
    }, ...prev]);
    setTitle(""); setLink(""); setMinutes(30);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);

  return (
    <Card style={{ width: "100%", maxWidth: 400 }}>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>🎥 Registrar aula em vídeo</div>

        Já assistiu uma aula fora do app? Salve o link e registre as horas sem precisar rodar o cronômetro.
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>

        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título (opcional)" style={input} />
        <input value={link} onChange={(e) => setLink(e.target.value)} placeholder="Link do vídeo (YouTube, etc.)" style={input} />
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>Duração assistida:</span>
