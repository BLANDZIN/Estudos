                <button onClick={addTopic} style={primaryBtn}>Adicionar</button>
              </div>
            )}
              </React.Fragment>
            )}
          </Card>
        );
      })}

      {subjects.length === 0 && <Card><EmptyRow text="Cadastre uma matéria primeiro." /></Card>}
      {subjects.length > 0 && (
        <Card>
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 6 }}>Adicionar assunto em qual matéria?</div>
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Card>
      )}

      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar guia via JSON</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
          Peça pra uma IA gerar sua grade de assuntos nesse formato e cole ou suba o arquivo aqui — matérias novas são
          criadas automaticamente.
        </div>
        <textarea value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder="Cole aqui o JSON gerado pela IA..."
          style={{ ...input, width: "100%", height: 100, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          <button onClick={importPasted} style={primaryBtn} disabled={!pasteText.trim()}>Importar texto colado</button>
          <label style={{ ...ghostBtn, display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
            Importar arquivo .json
            <input type="file" accept=".json" onChange={importFile} style={{ display: "none" }} />
          </label>
          <button onClick={exportGuide} style={ghostBtn}>Exportar guia atual</button>
        </div>
        {importMsg && <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>{importMsg}</div>}
        <button onClick={() => setShowFormat((v) => !v)} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px" }}>
          {showFormat ? "Ocultar formato esperado" : "Ver formato esperado"}
        </button>
        {showFormat && (
          <div style={{ marginTop: 8 }}>
            <pre style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, padding: 10, fontSize: 11, overflowX: "auto", fontFamily: "'JetBrains Mono', monospace" }}>{GUIDE_JSON_EXAMPLE}</pre>
            <button onClick={copyFormat} style={{ ...ghostBtn, fontSize: 11.5, padding: "4px 8px", marginTop: 6 }}>Copiar formato (pra colar no prompt da IA)</button>
          </div>
        )}
      </Card>
    </div>
  );
}

// ---------- Cronômetro ----------
const MODES = [
  { id: "pomodoro", label: "Pomodoro", direction: "down" },
  { id: "livre", label: "Livre", direction: "up" },
  { id: "regressiva", label: "Contagem regressiva", direction: "down" },
];

function Cronometro({ subjects, sessions, setSessions, timerSound }) {
  const [modeId, setModeId] = useState("pomodoro");
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [customMin, setCustomMin] = useState(25);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [note, setNote] = useState("");
  const intervalRef = useRef(null);
  const startRef = useRef(null);
  const accumulatedRef = useRef(0);
  const mode = MODES.find((m) => m.id === modeId);
  const targetSeconds = modeId === "livre" ? 0 : customMin * 60;

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  // timestamp-based ticking avoids drift from throttled background tabs
  useEffect(() => {
    if (running) {
      startRef.current = Date.now();
      intervalRef.current = setInterval(() => {
        setElapsed(accumulatedRef.current + (Date.now() - startRef.current) / 1000);
      }, 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  useEffect(() => {
    if (mode.direction === "down" && running && elapsed >= targetSeconds && targetSeconds > 0) {
      accumulatedRef.current = targetSeconds;
      setElapsed(targetSeconds);
      setRunning(false);
      if (timerSound) playBeep();
    }
  }, [elapsed, running, targetSeconds, mode.direction]);

  const display = mode.direction === "down" ? Math.max(0, targetSeconds - elapsed) : elapsed;
  const progress = mode.direction === "down" && targetSeconds > 0 ? Math.min(1, elapsed / targetSeconds) : 0;
  const finished = mode.direction === "down" && targetSeconds > 0 && elapsed >= targetSeconds;

  function reset() {
    setRunning(false);
    accumulatedRef.current = 0;
    setElapsed(0);
  }
  function pause() {
    accumulatedRef.current = elapsed;
    setRunning(false);
  }
  function finalize() {
    if (elapsed > 0 && subjectId) {
      setSessions((prev) => [{ id: uid(), subjectId, mode: modeId, seconds: Math.round(elapsed), endedAt: new Date().toISOString(), note: note.trim() }, ...prev]);
    }
    setNote(""); reset();
  }

  const activeSubject = subjects.find((s) => s.id === subjectId);
  const size = 220, stroke = 10, r = (size - stroke) / 2, circ = 2 * Math.PI * r;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, alignItems: "center" }}>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center" }}>
        {MODES.map((m) => (
          <button key={m.id} onClick={() => { if (!running) { setModeId(m.id); reset(); } }} style={{
            ...ghostBtn, background: modeId === m.id ? "var(--accent)" : "transparent", color: modeId === m.id ? "#14181C" : "var(--muted)",
            borderColor: modeId === m.id ? "var(--accent)" : "var(--line)", fontWeight: modeId === m.id ? 700 : 500,
          }}>{m.label}</button>
        ))}
      </div>

      {mode.direction === "down" && !running && elapsed === 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--muted)" }}>
          <span>Duração:</span>
          <input type="number" min={1} max={240} value={customMin} onChange={(e) => setCustomMin(Number(e.target.value) || 1)} style={{ ...input, width: 64, textAlign: "center" }} />
          <span>min</span>
        </div>
      )}

      <div style={{ position: "relative", width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} stroke="var(--surface2)" strokeWidth={stroke} fill="none" />
          {mode.direction === "down" && targetSeconds > 0 && (
            <circle cx={size / 2} cy={size / 2} r={r} stroke={finished ? "var(--accent2)" : "var(--accent)"} strokeWidth={stroke} fill="none"
              strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s linear" }} />
          )}
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 40, fontWeight: 700, letterSpacing: "-0.02em" }}>{fmtTime(display)}</div>
          {activeSubject && <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--muted)" }}><SubjectMark subject={activeSubject} /> {activeSubject.name}</div>}
          {finished && <div style={{ fontSize: 12, color: "var(--accent2)", fontWeight: 600 }}>Concluído</div>}
        </div>
      </div>

      <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={{ ...input, width: 200 }} disabled={running}>
        {subjects.length === 0 && <option value="">Cadastre uma matéria</option>}
        {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>

      <div style={{ display: "flex", gap: 8 }}>
        {!running ? (
          <button onClick={() => setRunning(true)} style={primaryBtn} disabled={!subjectId || finished}>{elapsed > 0 ? "Retomar" : "Iniciar"}</button>
        ) : (
          <button onClick={pause} style={ghostBtn}>Pausar</button>
        )}
        <button onClick={finalize} style={ghostBtn} disabled={elapsed === 0}>Finalizar sessão</button>
      </div>

      {elapsed > 0 && <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Nota da sessão (opcional)" style={{ ...input, width: "100%", maxWidth: 340 }} />}

      <VideoLessonForm subjects={subjects} setSessions={setSessions} />
    </div>
  );
}

function VideoLessonForm({ subjects, setSessions }) {
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [title, setTitle] = useState("");
  const [link, setLink] = useState("");
  const [minutes, setMinutes] = useState(30);
  const [saved, setSaved] = useState(false);

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  function save() {
    if (!subjectId || !link.trim() || minutes <= 0) return;
    setSessions((prev) => [{
      id: uid(), subjectId, mode: "video", seconds: minutes * 60, endedAt: new Date().toISOString(),
      note: title.trim() || "Aula em vídeo", link: link.trim(),
    }, ...prev]);
    setTitle(""); setLink(""); setMinutes(30);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  return (
    <Card style={{ width: "100%", maxWidth: 400 }}>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>🎥 Registrar aula em vídeo</div>
      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 10, lineHeight: 1.4 }}>
        Já assistiu uma aula fora do app? Salve o link e registre as horas sem precisar rodar o cronômetro.
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
          {subjects.length === 0 && <option value="">Cadastre uma matéria</option>}
          {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título (opcional)" style={input} />
        <input value={link} onChange={(e) => setLink(e.target.value)} placeholder="Link do vídeo (YouTube, etc.)" style={input} />
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>Duração assistida:</span>
          <input type="number" min={1} value={minutes} onChange={(e) => setMinutes(Number(e.target.value) || 1)} style={{ ...input, width: 64, textAlign: "center" }} />
          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>min</span>
        </div>
        <button onClick={save} style={primaryBtn} disabled={!subjectId || !link.trim()}>{saved ? "Salvo ✓" : "Salvar aula"}</button>
      </div>
    </Card>
  );
}

// ---------- Sessões ----------
function Sessoes({ subjects, sessions }) {
  const grouped = useMemo(() => {
    const map = {};
    sessions.forEach((s) => {
      const day = new Date(s.endedAt).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" });
      map[day] = map[day] || [];
      map[day].push(s);
    });
    return map;
  }, [sessions]);

  if (sessions.length === 0) return <Card><EmptyRow text="Nenhuma sessão registrada ainda. Use o cronômetro para começar." /></Card>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {Object.entries(grouped).map(([day, list]) => (
        <div key={day}>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6, textTransform: "capitalize" }}>{day}</div>
          <Card style={{ padding: 4 }}>
            {list.map((s, i) => {
              const subj = subjects.find((x) => x.id === s.subjectId);
              return (
                <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: i < list.length - 1 ? "1px solid var(--line)" : "none" }}>
                  <SubjectMark subject={subj} size={10} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14 }}>{s.mode === "video" ? "🎥 " : ""}{subj?.name || "Matéria removida"}</div>
                    {s.note && <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 1 }}>{s.note}</div>}
                    {s.link && <a href={s.link} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11.5, color: "var(--accent2)" }}>Abrir vídeo ↗</a>}
                  </div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>{fmtDuration(s.seconds)}</div>
                </div>
              );
            })}
          </Card>
        </div>
      ))}
    </div>
  );
}

// ---------- Importer (com upload de PDF) ----------
function Importer({ subjects, setQuestions, setTab }) {
  const [source, setSource] = useState("");
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [examText, setExamText] = useState("");
  const [keyText, setKeyText] = useState("");
  const [preview, setPreview] = useState(null);
  const [loadingExam, setLoadingExam] = useState(false);
  const [loadingKey, setLoadingKey] = useState(false);
  const [fileError, setFileError] = useState("");
  const examFileRef = useRef(null);
  const keyFileRef = useRef(null);

  useEffect(() => { if (!subjectId && subjects[0]) setSubjectId(subjects[0].id); }, [subjects]);

  async function handleExamFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setLoadingExam(true);
    try {
      const text = await extractAnyText(file);
      setExamText(text);
      if (!source.trim()) setSource(file.name.replace(/\.(pdf|txt)$/i, ""));
    } catch (err) {
      setFileError("Não consegui ler esse arquivo. Tente colar o texto manualmente.");
    } finally {
      setLoadingExam(false);
      e.target.value = "";
    }
  }

  async function handleKeyFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setLoadingKey(true);
    try {
      const text = await extractAnyText(file);
      setKeyText(text);
    } catch (err) {
      setFileError("Não consegui ler o gabarito. Tente colar o texto manualmente.");
    } finally {
      setLoadingKey(false);
      e.target.value = "";
    }
  }

  function runParse() {
    const parsedQuestions = parseExamText(examText);
    const answerMap = parseAnswerKey(keyText);
    const merged = parsedQuestions.map((q) => ({ ...q, answer: answerMap[q.num] || null }));
    setPreview(merged);
  }

  function confirmImport() {
    if (!preview) return;
    const toAdd = preview.filter((q) => q.hasAllAlts).map((q) => ({
      id: uid(), source: source.trim() || "Sem título", subjectId, topic: "",
      statement: q.statement, alternatives: q.alternatives, answer: q.answer,
      difficulty: null, userAnswer: null, correct: null, attempts: 0, errors: 0,
    }));
    setQuestions((prev) => [...toAdd, ...prev]);
    setExamText(""); setKeyText(""); setPreview(null);
    setTab("questoes");
  }

  const okCount = preview ? preview.filter((q) => q.hasAllAlts).length : 0;
  const withAnswerCount = preview ? preview.filter((q) => q.hasAllAlts && q.answer).length : 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Importar prova</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 12, lineHeight: 1.5 }}>
          Suba o PDF da prova e o do gabarito (ou cole o texto direto). O sistema extrai o texto do PDF no seu
          próprio navegador — nada é enviado a um servidor — e estrutura as questões automaticamente.
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <input value={source} onChange={(e) => setSource(e.target.value)} placeholder="Ex: ITA 2025" style={{ ...input, flex: 1, minWidth: 140 }} />
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <FileDrop label="PDF da prova" onFile={handleExamFile} inputRef={examFileRef} loading={loadingExam} hasContent={!!examText.trim()} />
          <FileDrop label="PDF do gabarito" onFile={handleKeyFile} inputRef={keyFileRef} loading={loadingKey} hasContent={!!keyText.trim()} />
        </div>

        {fileError && <div style={{ fontSize: 12.5, color: "var(--danger)", marginBottom: 10 }}>{fileError}</div>}

        <details>
          <summary style={{ fontSize: 12.5, color: "var(--muted)", cursor: "pointer", marginBottom: 8 }}>
            Ver / editar texto extraído (ou colar manualmente)
          </summary>
          <textarea value={examText} onChange={(e) => setExamText(e.target.value)}
            placeholder={"Questão 01\nEnunciado...\nA) ...\nB) ...\nC) ...\nD) ...\nE) ...\n\nQuestão 02\n..."}
            style={{ ...input, width: "100%", height: 140, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical", marginTop: 6 }} />
          <div style={{ height: 8 }} />
          <textarea value={keyText} onChange={(e) => setKeyText(e.target.value)}
            placeholder={"Gabarito:\n01 - C\n02 - A\n03 - E"}
            style={{ ...input, width: "100%", height: 80, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, resize: "vertical" }} />
        </details>

        <div style={{ marginTop: 12 }}>
          <button onClick={runParse} style={primaryBtn} disabled={!examText.trim()}>Analisar</button>
        </div>
      </Card>

      {preview && (
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Pré-visualização</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10 }}>
            {preview.length} questões encontradas · {okCount} com as 5 alternativas completas · {withAnswerCount} com gabarito cruzado
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 260, overflowY: "auto" }}>
            {preview.map((q) => (
              <div key={q.num} style={{ border: "1px solid var(--line)", borderRadius: 6, padding: "8px 10px", fontSize: 12.5, background: q.hasAllAlts ? "var(--surface2)" : "transparent" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                  <span style={{ fontWeight: 600 }}>Questão {q.num}</span>
                  <span style={{ color: q.hasAllAlts ? "var(--ok)" : "var(--danger)", fontFamily: "'JetBrains Mono', monospace" }}>
                    {q.hasAllAlts ? (q.answer ? `gabarito: ${q.answer}` : "sem gabarito") : "alternativas incompletas"}
                  </span>
                </div>
                <div style={{ color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{q.statement || "(sem enunciado detectado)"}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
            <button onClick={confirmImport} style={primaryBtn} disabled={okCount === 0}>Adicionar {okCount} questões ao banco</button>
            <button onClick={() => setPreview(null)} style={ghostBtn}>Descartar</button>
          </div>
        </Card>
      )}
    </div>
  );
}

function FileDrop({ label, onFile, inputRef, loading, hasContent }) {
  return (
    <label style={{
      border: `1px dashed ${hasContent ? "var(--accent)" : "var(--line)"}`, borderRadius: 8, padding: "16px 10px",
      display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer",
      background: hasContent ? "#26303A" : "var(--surface2)", textAlign: "center",
    }}>
      <input ref={inputRef} type="file" accept=".pdf,.txt" onChange={onFile} style={{ display: "none" }} />
      <span style={{ fontSize: 20 }}>{loading ? "⏳" : hasContent ? "✓" : "📄"}</span>
      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{label}</span>
      <span style={{ fontSize: 11, color: "var(--muted)" }}>{loading ? "lendo..." : hasContent ? "carregado — trocar arquivo" : "clique para subir"}</span>
    </label>
  );
}

// ---------- Question bank + practice ----------
function QuestionBank({ subjects, questions, setQuestions, setTab, celebrationEmoji }) {
  const [filterSubject, setFilterSubject] = useState("all");
  const [manualOpen, setManualOpen] = useState(false);
  const [practiceQueue, setPracticeQueue] = useState(null);

  const filtered = questions.filter((q) => filterSubject === "all" || q.subjectId === filterSubject);

  function startPractice(count) {
    const pool = filtered.filter((q) => q.answer);
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, count);
    if (shuffled.length > 0) setPracticeQueue(shuffled.map((q) => q.id));
  }
  function removeQuestion(id) { setQuestions((prev) => prev.filter((q) => q.id !== id)); }
  function addManual(q) {
    setQuestions((prev) => [{ ...q, id: uid(), attempts: 0, errors: 0, userAnswer: null, correct: null, difficulty: null }, ...prev]);
    setManualOpen(false);
  }
  function recordAnswer(id, letter) {
    setQuestions((prev) => prev.map((q) => {
      if (q.id !== id) return q;
      const isCorrect = letter === q.answer;
      return { ...q, userAnswer: letter, correct: isCorrect, attempts: q.attempts + 1, errors: q.errors + (isCorrect ? 0 : 1) };
    }));
  }

  if (practiceQueue) return <Practice questions={questions} queue={practiceQueue} onAnswer={recordAnswer} onExit={() => setPracticeQueue(null)} celebrationEmoji={celebrationEmoji} />;
  if (questions.length === 0) return <Card><EmptyRow text="Nenhuma questão no banco ainda." action="Importar prova" onAction={() => setTab("importar")} /></Card>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>Banco de questões · {filtered.length}</div>
          <select value={filterSubject} onChange={(e) => setFilterSubject(e.target.value)} style={input}>
            <option value="all">Todas as matérias</option>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => startPractice(5)} style={primaryBtn} disabled={filtered.filter((q) => q.answer).length === 0}>Praticar 5</button>
          <button onClick={() => startPractice(10)} style={ghostBtn} disabled={filtered.filter((q) => q.answer).length === 0}>Praticar 10</button>
          <button onClick={() => setManualOpen((v) => !v)} style={ghostBtn}>{manualOpen ? "Cancelar" : "Adicionar manualmente"}</button>
        </div>
      </Card>

      {manualOpen && <ManualQuestionForm subjects={subjects} onSave={addManual} />}

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {filtered.map((q) => {
          const subj = subjects.find((s) => s.id === q.subjectId);
          return (
            <Card key={q.id} style={{ padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 6 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--muted)" }}>
                  <SubjectMark subject={subj} /> {subj?.name || "—"} <span>· {q.source}</span>
                </div>
                <button onClick={() => removeQuestion(q.id)} style={iconBtn} aria-label="Remover questão">×</button>
              </div>
              <div style={{ fontSize: 13.5, marginBottom: 6 }}>{q.statement || "(sem enunciado)"}</div>
              <div style={{ fontSize: 11.5, color: "var(--muted)", display: "flex", gap: 12 }}>
                <span>Gabarito: {q.answer || "—"}</span>
                <span>Tentativas: {q.attempts}</span>
                <span>Erros: {q.errors}</span>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function ManualQuestionForm({ subjects, onSave }) {
  const [subjectId, setSubjectId] = useState(subjects[0]?.id || "");
  const [source, setSource] = useState("");
  const [topic, setTopic] = useState("");
  const [statement, setStatement] = useState("");
  const [alts, setAlts] = useState({ A: "", B: "", C: "", D: "", E: "" });
  const [answer, setAnswer] = useState("A");

  function save() {
    if (!statement.trim()) return;
    onSave({ subjectId, source: source.trim() || "Manual", topic: topic.trim(), statement: statement.trim(), alternatives: alts, answer });
    setSource(""); setTopic(""); setStatement(""); setAlts({ A: "", B: "", C: "", D: "", E: "" });
  }

  return (
    <Card>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Nova questão</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select value={subjectId} onChange={(e) => setSubjectId(e.target.value)} style={input}>
            {subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <input value={source} onChange={(e) => setSource(e.target.value)} placeholder="Fonte (ex: ITA 2025)" style={{ ...input, flex: 1, minWidth: 120 }} />
          <input value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Tópico (ex: Geometria)" style={{ ...input, flex: 1, minWidth: 120 }} />
        </div>
        <textarea value={statement} onChange={(e) => setStatement(e.target.value)} placeholder="Enunciado" style={{ ...input, width: "100%", height: 60, resize: "vertical" }} />
        {LETTERS.map((l) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12.5, color: "var(--muted)", width: 60 }}>
              <input type="radio" name="answer" checked={answer === l} onChange={() => setAnswer(l)} /> {l})
            </label>
            <input value={alts[l]} onChange={(e) => setAlts((prev) => ({ ...prev, [l]: e.target.value }))} placeholder={`Alternativa ${l}`} style={{ ...input, flex: 1 }} />
          </div>
        ))}
        <div><button onClick={save} style={primaryBtn} disabled={!statement.trim()}>Salvar questão</button></div>
      </div>
    </Card>
  );
}

function Practice({ questions, queue, onAnswer, onExit, celebrationEmoji }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const q = questions.find((x) => x.id === queue[idx]);
  const correctCount = queue.slice(0, idx).filter((id) => questions.find((x) => x.id === id)?.correct).length;

  if (!q) {
    return (
      <Card>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Sessão de prática concluída {celebrationEmoji || "🔥"}</div>
        <div style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 12 }}>{correctCount}/{queue.length} acertos</div>
        <button onClick={onExit} style={primaryBtn}>Voltar ao banco</button>
      </Card>
    );
  }

  function choose(letter) { if (picked) return; setPicked(letter); onAnswer(q.id, letter); }
  function next() { setPicked(null); setIdx((i) => i + 1); }

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--muted)", marginBottom: 10 }}>
        <span>Questão {idx + 1} de {queue.length}</span>
        <button onClick={onExit} style={{ ...iconBtn, fontSize: 12.5 }}>Sair</button>
      </div>
      <div style={{ fontSize: 14.5, marginBottom: 14, lineHeight: 1.5 }}>{q.statement}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {LETTERS.filter((l) => q.alternatives?.[l]).map((l) => {
          const isCorrectAns = picked && l === q.answer;
          const isWrongPick = picked && picked === l && l !== q.answer;
          return (
            <button key={l} onClick={() => choose(l)} disabled={!!picked} style={{
              textAlign: "left", padding: "10px 12px", borderRadius: 6,
              border: `1px solid ${isCorrectAns ? "var(--ok)" : isWrongPick ? "var(--danger)" : "var(--line)"}`,
              background: isCorrectAns ? "#8FBF5F1A" : isWrongPick ? "#D970661A" : "var(--surface2)",
              color: "var(--text)", fontSize: 13.5, cursor: picked ? "default" : "pointer",
            }}><strong>{l})</strong> {q.alternatives[l]}</button>
          );
        })}
      </div>
      {picked && (
        <div style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: picked === q.answer ? "var(--ok)" : "var(--danger)", fontWeight: 600 }}>
            {picked === q.answer ? "Certo!" : `Errado — resposta: ${q.answer}`}
          </span>
          <button onClick={next} style={primaryBtn}>{idx + 1 < queue.length ? "Próxima" : "Finalizar"}</button>
        </div>
      )}
    </Card>
  );
}
