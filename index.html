const AGNES_BACKEND_KEY = "agnes-backend-url";

function formatRP(text) {
  // *ação entre asteriscos* vira itálico — resto do texto normal
  const parts = text.split(/(\*[^*]+\*)/g);
  return parts.map((p, i) => {
    if (p.startsWith("*") && p.endsWith("*") && p.length > 2) {
      return <em key={i} style={{ color: "var(--muted)" }}>{p.slice(1, -1)}</em>;
    }
    return <React.Fragment key={i}>{p}</React.Fragment>;
  });
}

function AgnesSettings({ backendUrl, setBackendUrl }) {
  const [testStatus, setTestStatus] = useState(null); // null | "testing" | "ok" | "error"
  const [testMsg, setTestMsg] = useState("");
  const [config, setConfig] = useState(null);
  const [models, setModels] = useState(null);
  const [modelsStatus, setModelsStatus] = useState(null); // null | "loading" | "ok" | "error"
  const [modelsMsg, setModelsMsg] = useState("");

  function friendlyNetworkError(err) {
    return err instanceof TypeError ? `Não consegui alcançar ${backendUrl}. O backend está rodando?` : err.message;
  }

  async function testConnection() {
    setTestStatus("testing"); setTestMsg(""); setConfig(null);
    try {
      const base = backendUrl.replace(/\/$/, "");
      const res = await fetch(`${base}/health`);
      if (!res.ok) throw new Error(`Erro ${res.status} em /health`);
      const health = await res.json();
      const cfgRes = await fetch(`${base}/config`);
      setConfig(cfgRes.ok ? await cfgRes.json() : null);
      setTestStatus("ok");
      setTestMsg(`Conectado — provedor: ${health.provider}`);
    } catch (err) {
      setTestStatus("error");
      setTestMsg(friendlyNetworkError(err));
    }
  }

  async function findModels() {
    setModelsStatus("loading"); setModelsMsg(""); setModels(null);
    try {
      const base = backendUrl.replace(/\/$/, "");
      const res = await fetch(`${base}/models`);
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error((body && body.detail) || `Erro ${res.status}`);
      }
      setModels(await res.json());
      setModelsStatus("ok");
    } catch (err) {
      setModelsStatus("error");
      setModelsMsg(friendlyNetworkError(err));
    }
  }

  return (
    <Card>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>✨ Agnes — companheira de estudos</div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.5 }}>
        Configura a conexão com o backend local da Agnes. O modelo em si (Ollama, llama.cpp, API na nuvem...)
        é escolhido no <code>.env</code> do backend — aqui você só aponta pra ele e confere se está tudo certo,
        sem precisar abrir o terminal.
      </div>

      <div style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>Endereço do backend</div>
        <input value={backendUrl} onChange={(e) => setBackendUrl(e.target.value)} placeholder="http://127.0.0.1:8787" style={{ ...input, width: "100%" }} />
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <button onClick={testConnection} style={primaryBtn} disabled={testStatus === "testing"}>
          {testStatus === "testing" ? "Testando..." : "Testar conexão"}
        </button>
        <button onClick={findModels} style={ghostBtn} disabled={modelsStatus === "loading"}>
          {modelsStatus === "loading" ? "Buscando..." : "Buscar modelos disponíveis"}
        </button>
      </div>

      {testStatus && (
        <div style={{ fontSize: 12.5, color: testStatus === "ok" ? "var(--ok)" : testStatus === "error" ? "var(--danger)" : "var(--muted)", marginBottom: 8 }}>
          {testMsg}
        </div>
      )}

      {config && (
        <div style={{ background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, fontSize: 12, marginBottom: 10, fontFamily: "'JetBrains Mono', monospace", display: "flex", flexDirection: "column", gap: 2 }}>
          <div>provedor: {config.provider}</div>
          <div>flavor: {config.flavor}</div>
          <div>modelo configurado: {config.model}</div>
          <div>endpoint do modelo: {config.base_url}</div>
        </div>
      )}

      {modelsStatus === "error" && <div style={{ fontSize: 12.5, color: "var(--danger)", marginBottom: 8 }}>{modelsMsg}</div>}

      {models && (
        <div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>
            Modelos encontrados no servidor {models.models.length === 0 ? "(nenhum)" : `(${models.models.length})`}:
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {models.models.map((m) => (
              <div key={m} style={{
                display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, padding: "4px 8px", borderRadius: 6,
                background: m === models.current_model ? "var(--accent)22" : "transparent",
                border: `1px solid ${m === models.current_model ? "var(--accent)" : "var(--line)"}`,
              }}>
                <span style={{ flex: 1, fontFamily: "'JetBrains Mono', monospace" }}>{m}</span>
                {m === models.current_model && <span style={{ fontSize: 10.5, color: "var(--accent)" }}>em uso</span>}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 6 }}>
            Pra usar outro (que não o "em uso"), ajuste AGNES_LLM_MODEL no .env do backend com o nome
            exatamente como aparece na lista, e reinicie o backend.
          </div>
        </div>
      )}
    </Card>
  );
}

function ExamPagePin({ pin, disarmTick, onMoveEnd, onEdit, onDelete }) {
  const [open, setOpen] = useState(false);
  const [moving, setMoving] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(pin.text);
  const dragRef = useRef(null);
  const suppressClick = useRef(false);

  // toque em outro lugar da página desarma a mão deste balão
  const firstTick = useRef(true);
  useEffect(() => {
    if (firstTick.current) { firstTick.current = false; return; }
    setMoving(false);
    dragRef.current = null;
  }, [disarmTick]);

  function onPointerDown(e) {
    // só inicia arrasto se a mão estiver armada; botões/textarea barram antes (stopPropagation)
    if (!moving || editing) return;
    const el = e.currentTarget;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    dragRef.current = { id: e.pointerId, moved: false, sx: e.clientX, sy: e.clientY };
  }
  function onPointerMove(e) {
    if (!moving || !dragRef.current || dragRef.current.id !== e.pointerId) return;
    const d = dragRef.current;
    if (!d.moved && Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 6) d.moved = true;
    if (!d.moved) return;
    const parent = e.currentTarget.parentElement;
    const rect = parent.getBoundingClientRect();
    let nx = (e.clientX - rect.left) / rect.width;
    let ny = (e.clientY - rect.top) / rect.height;
    nx = Math.max(0.02, Math.min(0.98, nx));
    ny = Math.max(0.02, Math.min(0.98, ny));
    onMoveEnd(pin.id, nx, ny);
  }
  function onPointerUp(e) {
    if (!dragRef.current) return;
    const wasMoved = dragRef.current.moved;
    dragRef.current = null;
    if (wasMoved) {
      suppressClick.current = true;
      setTimeout(() => { suppressClick.current = false; }, 80);
    }
  }

  function handleBodyClick(e) {
    e.stopPropagation();
    if (suppressClick.current) return;
    if (moving || editing) return;
    setOpen((v) => !v);
  }

  function startEdit(e) {
    if (e) e.stopPropagation();
    setDraft(pin.text || "");
    setEditing(true);
    setOpen(true);
    setMoving(false);
    dragRef.current = null;
  }
  function confirmEdit(e) {
    if (e) e.stopPropagation();
    onEdit(pin.id, draft);
    setEditing(false);
  }
  function cancelEdit(e) {
    if (e) e.stopPropagation();
    setEditing(false);
  }
  function handleDelete(e) {
    if (e) e.stopPropagation();
    onDelete(pin.id);
  }
  function toggleMove(e) {
    if (e) e.stopPropagation();
    dragRef.current = null;
    setMoving((v) => !v);
  }
  // barra o toque antes de chegar no arrasto do balão (evita captura indevida)
  function barTouch(e) { e.stopPropagation(); }

  const color = pin.color || "#E8A33D";

  return (
    <div
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={() => { dragRef.current = null; }}
      onClick={handleBodyClick}
      style={{
        position: "absolute", left: (pin.x * 100) + "%", top: (pin.y * 100) + "%",
        transform: "translate(-50%, -100%)",
        touchAction: moving ? "none" : "auto",
        cursor: moving ? "grabbing" : "pointer",
        zIndex: open || moving ? 8 : 5, maxWidth: "72%",
        outline: moving ? `2px dashed ${color}` : "none",
        outlineOffset: 2, borderRadius: 10,
        userSelect: "none", WebkitUserSelect: "none",
      }}
    >
      <div style={{
        background: "#14181C", border: `2px solid ${color}`, borderRadius: "10px 10px 10px 2px",
        padding: "6px 8px", fontSize: 12.5, lineHeight: 1.4, color: "var(--text)",
        boxShadow: "0 3px 10px rgba(0,0,0,0.5)", minWidth: 90,
        userSelect: "none", WebkitUserSelect: "none",
      }}>
        {editing ? (
          <div onClick={(e) => e.stopPropagation()} onPointerDown={barTouch}>
            <textarea
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              autoFocus
              rows={2}
              style={{ ...input, width: "100%", fontSize: 12.5, resize: "vertical", userSelect: "text", WebkitUserSelect: "text" }}
            />
            <div style={{ display: "flex", gap: 6, marginTop: 4 }} onPointerDown={barTouch}>
              <button onPointerDown={barTouch} onClick={confirmEdit} style={{ ...primaryBtn, padding: "4px 10px", fontSize: 12 }}>OK</button>
              <button onPointerDown={barTouch} onClick={cancelEdit} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 12 }}>Cancelar</button>
            </div>
          </div>
        ) : (
          <React.Fragment>
            <div style={{ whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{pin.text || "(toque para abrir)"}</div>
            {open && (
              <div style={{ display: "flex", gap: 4, marginTop: 6, borderTop: "1px solid var(--line)", paddingTop: 6 }} onClick={(e) => e.stopPropagation()} onPointerDown={barTouch}>
                <button
                  onPointerDown={barTouch}
                  onClick={toggleMove}
                  title={moving ? "Toque para fixar (parar de mover)" : "Mover balão"}
                  style={moving ? { ...primaryBtn, padding: "4px 8px", fontSize: 13 } : { ...ghostBtn, padding: "4px 8px", fontSize: 13 }}
                >
                  {moving ? "🖐️ fixar" : "🖐️ mover"}
                </button>
                <button onPointerDown={barTouch} onClick={startEdit} title="Escrever no balão" style={{ ...ghostBtn, padding: "4px 8px", fontSize: 13 }}>✏️</button>
                <button onPointerDown={barTouch} onClick={handleDelete} title="Tirar balão" style={{ ...ghostBtn, padding: "4px 8px", fontSize: 13, borderColor: "var(--danger)", color: "var(--danger)" }}>🗑️</button>
              </div>
            )}
          </React.Fragment>
        )}
        {moving && !editing && (
          <div style={{ fontSize: 10.5, color: color, marginTop: 4, fontWeight: 700 }}>arrastando... toque em 🖐️ fixar</div>
        )}
      </div>
      <div style={{ width: 2, height: 14, background: color, margin: "0 auto" }} />
      <div style={{ width: 10, height: 10, borderRadius: "50%", background: color, margin: "0 auto", border: "2px solid #14181C" }} />
    </div>
  );
}

function ExamPageView({ pageInfo, pageIndex, strokes, pins, tool, strokeColor, strokeWidth, disarmTick, onDisarm, onStrokeEnd, onEraseAt, onPinAdd, onPinMoveEnd, onPinEdit, onPinDelete }) {
  const baseRef = useRef(null);
  const overRef = useRef(null);
  const curStroke = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const canvas = baseRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        await pageInfo.page.render({ canvasContext: ctx, viewport: pageInfo.viewport }).promise;
        if (!cancelled) redrawOverlay();
      } catch (e) {}
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pageInfo]);

  useEffect(() => { redrawOverlay(); });

  function redrawOverlay() {
    const canvas = overRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    (strokes || []).forEach((st) => {
      if (!st.points || st.points.length === 0) return;
      ctx.strokeStyle = st.color;
      ctx.lineWidth = st.width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      st.points.forEach((p, i) => {
        const px = p[0] * canvas.width;
        const py = p[1] * canvas.height;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      if (st.points.length === 1) {
        const px = st.points[0][0] * canvas.width;
        const py = st.points[0][1] * canvas.height;
        ctx.fillStyle = st.color;
        ctx.beginPath();
        ctx.arc(px, py, st.width / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.stroke();
      }
    });
  }

  function toNorm(e) {
    const canvas = overRef.current;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
    const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
    return [
      Math.max(0, Math.min(1, (cx - rect.left) / rect.width)),
      Math.max(0, Math.min(1, (cy - rect.top) / rect.height)),
    ];
  }

  function handleDown(e) {
    if (onDisarm) onDisarm();
    if (tool === "move") return;
    e.preventDefault();
    const [nx, ny] = toNorm(e);
    if (tool === "text") {
      onPinAdd(pageIndex, nx, ny);
      return;
    }
    if (tool === "erase") {
      onEraseAt(pageIndex, nx, ny);
      curStroke.current = { erasing: true };
      return;
    }
    curStroke.current = { color: strokeColor, width: strokeWidth * 1.5, points: [[nx, ny]] };
  }

  function handleMove(e) {
    if (!curStroke.current || tool === "move" || tool === "text") return;
    e.preventDefault();
    const [nx, ny] = toNorm(e);
    if (curStroke.current.erasing) {
      onEraseAt(pageIndex, nx, ny);
      return;
    }
    const pts = curStroke.current.points;
    const last = pts[pts.length - 1];
    const dx = (nx - last[0]) * overRef.current.width;
    const dy = (ny - last[1]) * overRef.current.height;
    if (dx * dx + dy * dy < 4) return;
    pts.push([nx, ny]);
    const ctx = overRef.current.getContext("2d");
    ctx.strokeStyle = curStroke.current.color;
    ctx.lineWidth = curStroke.current.width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(last[0] * overRef.current.width, last[1] * overRef.current.height);
    ctx.lineTo(nx * overRef.current.width, ny * overRef.current.height);
    ctx.stroke();
  }

  function handleUp() {
    if (!curStroke.current) return;
    if (!curStroke.current.erasing && curStroke.current.points.length > 0) {
      onStrokeEnd(pageIndex, { id: uid(), color: curStroke.current.color, width: curStroke.current.width, points: curStroke.current.points });
    }
    curStroke.current = null;
  }

  return (
    <div style={{ position: "relative", width: "100%", marginBottom: 12, border: "1px solid var(--line)", borderRadius: 8, overflow: "hidden", background: "#fff" }}>
      <canvas ref={baseRef} width={pageInfo.width} height={pageInfo.height} style={{ width: "100%", display: "block" }} />
      <canvas
        ref={overRef}
        width={pageInfo.width}
        height={pageInfo.height}
        onPointerDown={handleDown}
        onPointerMove={handleMove}
        onPointerUp={handleUp}
        onPointerLeave={handleUp}
        onPointerCancel={handleUp}
        style={{
          position: "absolute", inset: 0, width: "100%", height: "100%",
          touchAction: tool === "move" ? "auto" : "none",
          cursor: tool === "pen" ? "crosshair" : tool === "erase" ? "cell" : tool === "text" ? "text" : "default",
        }}
      />
      {(pins || []).map((p) => (
        <ExamPagePin key={p.id} pin={p} disarmTick={disarmTick} onMoveEnd={(id, x, y) => onPinMoveEnd(pageIndex, id, x, y)} onEdit={(id, text) => onPinEdit(pageIndex, id, text)} onDelete={(id) => onPinDelete(pageIndex, id)} />
      ))}
      <div style={{ position: "absolute", left: 8, bottom: 6, fontSize: 10.5, color: "rgba(255,255,255,0.85)", background: "rgba(0,0,0,0.55)", borderRadius: 4, padding: "1px 7px", pointerEvents: "none" }}>
        pág. {pageIndex + 1}
      </div>
    </div>
  );
}

function SavedExams({ exams, setExams, subjects }) {
  const [editingId, setEditingId] = useState(null);
  const [editTitle, setEditTitle] = useState("");
  const [viewingExam, setViewingExam] = useState(null);
  const [pdfTab, setPdfTab] = useState("prova");
  const [tool, setTool] = useState("move");
  const [strokeColor, setStrokeColor] = useState("#E8A33D");
  const [strokeWidth, setStrokeWidth] = useState(2);
  const [pageNotes, setPageNotes] = useState({});
  const [disarmTick, setDisarmTick] = useState(0);
  const [pdfPages, setPdfPages] = useState([]);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [pdfError, setPdfError] = useState("");

  function formatDate(dateStr) {
    try {
      return new Date(dateStr + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
    } catch (e) { return dateStr; }
  }

  function countMarks(exam) {
    const pn = exam.pageNotes || {};
    let strokes = 0, pins = 0;
    Object.values(pn).forEach((v) => { strokes += (v.strokes || []).length; pins += (v.pins || []).length; });
    const legacy = (exam.textNotes || exam.annotations || []).length;
    return { strokes, pins: pins + legacy };
  }

  function deleteExam(id) {
    if (window.confirm("Excluir esta prova salva? As questões importadas no banco permanecerão.")) {
      setExams((prev) => prev.filter((e) => e.id !== id));
    }
  }

  function startRename(exam) {
    setEditingId(exam.id);
    setEditTitle(exam.title || "");
  }

  function saveRename(id) {
    setExams((prev) => prev.map((e) => (e.id === id ? { ...e, title: editTitle.trim() || e.title } : e)));
    setEditingId(null);
  }

  function migrateLegacy(exam) {
    if (exam.pageNotes) return exam.pageNotes;
    const legacy = exam.textNotes || exam.annotations || [];
    if (!legacy.length) return {};
    return {
      "prova:0": {
        strokes: [],
        pins: legacy.map((n, i) => ({
          id: n.id || uid(),
          x: 0.12 + ((i * 7) % 4) * 0.22,
          y: 0.08 + Math.floor(((i * 7) % 16) / 4) * 0.14,
          text: n.text || "",
          color: n.color || "#E8A33D",
        })),
      },
    };
  }

  function openViewer(exam) {
    setViewingExam(exam);
    setPdfTab(exam.examPdfDataUrl ? "prova" : "gabarito");
    setPageNotes(migrateLegacy(exam));
    setTool("move");
  }

  function persistAndClose() {
    if (viewingExam) {
      const snapshot = pageNotes;
      setExams((prev) => prev.map((e) => (e.id === viewingExam.id ? { ...e, pageNotes: snapshot } : e)));
    }
    setViewingExam(null);
    setPageNotes({});
    setPdfPages([]);
    setPdfError("");
  }

  function getPage(pageIndex) {
    return pageNotes[pageIndex] || { strokes: [], pins: [] };
  }

  function setPage(pageIndex, patch) {
    setPageNotes((prev) => ({ ...prev, [pageIndex]: { ...getPageRef(prev, pageIndex), ...patch } }));
  }

  function getPageRef(pn, pageIndex) {
    return pn[pageIndex] || { strokes: [], pins: [] };
  }

  function handleStrokeEnd(pageIndex, stroke) {
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      return { ...prev, [pageIndex]: { ...cur, strokes: [...cur.strokes, stroke] } };
    });
  }

  function handleEraseAt(pageIndex, nx, ny) {
    const R = 0.03;
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      if (!cur.strokes.length) return prev;
      const kept = cur.strokes.filter((st) =>
        !(st.points || []).some((p) => {
          const dx = p[0] - nx, dy = (p[1] - ny) * 1.4;
          return dx * dx + dy * dy < R * R;
        })
      );
      if (kept.length === cur.strokes.length) return prev;
      return { ...prev, [pageIndex]: { ...cur, strokes: kept } };
    });
  }

  function handlePinAdd(pageIndex, nx, ny) {
    const pin = { id: uid(), x: Math.max(0.05, Math.min(0.95, nx)), y: Math.max(0.05, Math.min(0.95, ny)), text: "Nova anotação", color: strokeColor };
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      return { ...prev, [pageIndex]: { ...cur, pins: [...cur.pins, pin] } };
    });
    // carimbo único: depois de fixar um balão volta a navegar (evita criar vários sem querer)
    setTool("move");
  }

  function handlePinMoveEnd(pageIndex, id, x, y) {
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      return { ...prev, [pageIndex]: { ...cur, pins: cur.pins.map((p) => (p.id === id ? { ...p, x, y } : p)) } };
    });
  }

  function handlePinEdit(pageIndex, id, text) {
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      return { ...prev, [pageIndex]: { ...cur, pins: cur.pins.map((p) => (p.id === id ? { ...p, text } : p)) } };
    });
  }

  function handlePinDelete(pageIndex, id) {
    setPageNotes((prev) => {
      const cur = getPageRef(prev, pageIndex);
      return { ...prev, [pageIndex]: { ...cur, pins: cur.pins.filter((p) => p.id !== id) } };
    });
  }

  useEffect(() => {
    if (!viewingExam) return;
    let cancelled = false;
    setPdfPages([]);
    setPdfError("");
    setPdfLoading(true);
    (async () => {
      try {
        const dataUrl = pdfTab === "prova" ? viewingExam.examPdfDataUrl : viewingExam.keyPdfDataUrl;
        if (!dataUrl || dataUrl.indexOf(",") === -1) throw new Error("empty");
        const mime = dataUrl.slice(0, dataUrl.indexOf(";"));
        if (mime.indexOf("pdf") === -1) throw new Error("notpdf");
        const bin = atob(dataUrl.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          if (cancelled) return;
          const pg = await pdf.getPage(p);
          const vp = pg.getViewport({ scale: 1.5 });
          if (cancelled) return;
          setPdfPages((prev) => [...prev, { page: pg, width: Math.floor(vp.width), height: Math.floor(vp.height), viewport: vp }]);
        }
      } catch (e) {
        if (!cancelled) setPdfError("Não consegui renderizar este arquivo como PDF — mas as questões importadas continuam no banco.");
      } finally {
        if (!cancelled) setPdfLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [viewingExam, pdfTab]);

  if (!exams || exams.length === 0) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>📁 Provas Salvas</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5 }}>
            Importe provas PDF na aba <strong>Importar</strong> — elas aparecerão aqui com as páginas originais
            para você desenhar rascunhos por cima e fixar balões de anotação onde quiser.
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 10 }}>📁 Provas Salvas · {exams.length}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {exams.map((exam) => {
            const marks = countMarks(exam);
            return (
              <div key={exam.id} style={{ border: "1px solid var(--line)", borderRadius: 8, padding: 12, background: "var(--surface2)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 8 }}>
                  {editingId === exam.id ? (
                    <input value={editTitle} onChange={(e) => setEditTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveRename(exam.id)} onBlur={() => saveRename(exam.id)} autoFocus style={{ ...input, flex: 1, minWidth: 150, fontWeight: 600, fontSize: 14 }} />
                  ) : (
                    <span style={{ flex: 1, fontWeight: 600, fontSize: 14, cursor: "pointer" }} onClick={() => startRename(exam)}>{exam.title}</span>
                  )}
                  <span style={{ fontSize: 12, color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>{formatDate(exam.date)}</span>
                  <span style={{ fontSize: 12, color: "var(--accent2)", fontFamily: "'JetBrains Mono', monospace" }}>{exam.questionCount} questões</span>
                  <button onClick={() => openViewer(exam)} style={primaryBtn} disabled={!exam.examPdfDataUrl && !exam.keyPdfDataUrl}>Abrir prova</button>
                  {editingId !== exam.id && <button onClick={() => startRename(exam)} style={iconBtn} aria-label="Renomear" title="Renomear">✏️</button>}
                  <button onClick={() => deleteExam(exam.id)} style={{ ...iconBtn, color: "var(--danger)" }} aria-label="Excluir" title="Excluir">×</button>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", fontSize: 11.5, color: "var(--muted)" }}>
                  {exam.examPdfDataUrl && <span>📄 Prova</span>}
                  {exam.keyPdfDataUrl && <span>🔑 Gabarito</span>}
                  {marks.pins > 0 && <span>💬 {marks.pins} {marks.pins === 1 ? "balão" : "balões"}</span>}
                  {marks.strokes > 0 && <span>✏️ {marks.strokes} {marks.strokes === 1 ? "rascunho" : "rascunhos"}</span>}
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      {viewingExam && (
        <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.94)", display: "flex", flexDirection: "column" }}>
          <div style={{ background: "var(--surface)", borderBottom: "1px solid var(--line)", padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
            <span style={{ fontWeight: 600, fontSize: 15 }}>{viewingExam.title}</span>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              {viewingExam.examPdfDataUrl && <button onClick={() => setPdfTab("prova")} style={pdfTab === "prova" ? primaryBtn : ghostBtn}>📄 Prova</button>}
              {viewingExam.keyPdfDataUrl && <button onClick={() => setPdfTab("gabarito")} style={pdfTab === "gabarito" ? primaryBtn : ghostBtn}>🔑 Gabarito</button>}
              <button onClick={persistAndClose} style={primaryBtn}>Salvar e fechar</button>
            </div>
          </div>

          <div style={{ background: "var(--surface)", borderBottom: "1px solid var(--line)", padding: "8px 16px", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <button onClick={() => setTool("move")} style={tool === "move" ? primaryBtn : ghostBtn} title="Só navegar e arrastar balões">🖱️ Navegar</button>
            <button onClick={() => setTool("pen")} style={tool === "pen" ? primaryBtn : ghostBtn} title="Desenhar por cima da página">✏️ Desenhar</button>
            <button onClick={() => setTool("erase")} style={tool === "erase" ? primaryBtn : ghostBtn} title="Apagar rascunhos">🧹 Borracha</button>
            <button onClick={() => setTool("text")} style={tool === "text" ? primaryBtn : ghostBtn} title="Toque na página para fixar um balão">💬 Balão</button>
            {(tool === "pen" || tool === "text") && (
              <input type="color" value={strokeColor} onChange={(e) => setStrokeColor(e.target.value)} title="Cor" style={{ width: 30, height: 30, padding: 0, border: "none", borderRadius: "50%", cursor: "pointer", background: "none" }} />
            )}
            {tool === "pen" && (
              <input type="range" min="1" max="8" value={strokeWidth} onChange={(e) => setStrokeWidth(Number(e.target.value))} title="Espessura" style={{ width: 90 }} />
            )}
            {tool === "text" && <span style={{ fontSize: 11.5, color: "var(--muted)" }}>toque na página para fixar um balão (vale 1 por vez) — depois toque no balão para usar as ferramentas</span>}
            {tool === "pen" && <span style={{ fontSize: 11.5, color: "var(--muted)" }}>desenhe por cima da página</span>}
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: 12, display: "flex", flexDirection: "column", alignItems: "center" }}>
            {pdfLoading && pdfPages.length === 0 && <div style={{ color: "var(--muted)", padding: 40 }}>Carregando páginas...</div>}
            {pdfError && <div style={{ color: "var(--danger)", padding: 20, fontSize: 13, textAlign: "center" }}>{pdfError}</div>}
            <div style={{ width: "100%", maxWidth: 860 }}>
              {pdfPages.map((pg, idx) => {
                const pageKey = pdfTab + ":" + idx;
                const pn = getPage(pageKey);
                return (
                  <ExamPageView
                    key={pdfTab + "-" + idx}
                    pageInfo={pg}
                    pageIndex={idx}
                    strokes={pn.strokes}
                    pins={pn.pins}
                    tool={tool}
                    strokeColor={strokeColor}
                    strokeWidth={strokeWidth}
                    disarmTick={disarmTick}
                    onDisarm={() => setDisarmTick((t) => t + 1)}
                    onStrokeEnd={(pi, st) => handleStrokeEnd(pdfTab + ":" + pi, st)}
                    onEraseAt={(pi, x, y) => handleEraseAt(pdfTab + ":" + pi, x, y)}
                    onPinAdd={(pi, x, y) => handlePinAdd(pdfTab + ":" + pi, x, y)}
                    onPinMoveEnd={(pi, id, x, y) => handlePinMoveEnd(pdfTab + ":" + pi, id, x, y)}
                    onPinEdit={(pi, id, text) => handlePinEdit(pdfTab + ":" + pi, id, text)}
                    onPinDelete={(pi, id) => handlePinDelete(pdfTab + ":" + pi, id)}
                  />
                );
              })}
            </div>
            {!pdfLoading && !pdfError && pdfPages.length === 0 && (
              <div style={{ color: "var(--muted)", padding: 40 }}>Nenhuma página para exibir.</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function AgnesBubble({ subjects, blocks, sessions, setSessions, topics, setTopics, goals, setGoals, accent, setTab, backendUrl, setBackendUrl }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role: "agnes", text: "*acena* Oi! Sou a Agnes. Pode me chamar se quiser conversar ou se eu puder ajudar com alguma coisa por aqui." },
  ]);
  const [inputText, setInputText] = useState("");
  const [sending, setSending] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const listRef = useRef(null);

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, open]);

  function buildAppContext() {
    const today = new Date().getDay();
    return {
      today_label: DAY_LABELS[today],
      current_subject: subjects[0] ? subjects[0].name : null,
    };
  }

  // ferramentas que dão pra resolver na hora, sem outra ida ao modelo —
  // devolve um texto factual pra mostrar como fala da Agnes
  function runLocalTool(action) {
    const { name, args } = action;
    switch (name) {
      case "open_screen":
        setTab(args.screen);
        return null;
      case "start_timer":
        setTab("cronometro");
        setTimeout(() => AgnesBus.emit({ name: "start_timer", args }), 80);
        return null;
      case "pause_timer":
        AgnesBus.emit({ name: "pause_timer", args: {} });
        return null;
      case "stop_timer":
        AgnesBus.emit({ name: "stop_timer", args: {} });
        return null;
      case "select_subject":
        AgnesBus.emit({ name: "select_subject", args });
        return null;
      case "get_today_schedule": {
        const today = new Date().getDay();
        const names = blocks.filter((b) => b.day === today).map((b) => {
          const s = subjects.find((x) => x.id === b.subjectId);
          return s ? s.name + (b.label ? ` (${b.label})` : "") : null;
        }).filter(Boolean);
        return names.length ? `*confere a agenda* Hoje: ${names.join(", ")}.` : "*olha o plano* Nada marcado pra hoje.";
      }
      case "get_study_progress": {
        if (args.subject_name) {
          const subj = subjects.find((s) => s.name.toLowerCase() === args.subject_name.toLowerCase());
          if (!subj) return `Não achei "${args.subject_name}" nas suas matérias.`;
          const pct = subjectCompletionPct(subj.id, topics);
          return pct === null ? `${subj.name} ainda não tem assuntos no guia.` : `${subj.name} está ${pct}% completa.`;
        }
        const summary = subjects.map((s) => {
          const pct = subjectCompletionPct(s.id, topics);
          return pct === null ? null : `${s.name} ${pct}%`;
        }).filter(Boolean);
        return summary.length ? `*dá uma olhada geral* ${summary.join(" · ")}` : "Ainda não tem nada no guia de estudos pra eu acompanhar.";
      }
      case "record_study_progress": {
        const subj = subjects.find((s) => s.name.toLowerCase() === args.subject_name.toLowerCase());
        if (!subj) return `Não achei a matéria "${args.subject_name}".`;
        let found = false;
        setTopics((prev) => prev.map((t) => {
          if (t.subjectId !== subj.id) return t;
          if (t.name.toLowerCase() === args.topic_name.toLowerCase() && (!t.subtopics || !t.subtopics.length)) {
            found = true;
            return { ...t, status: args.status };
          }
          if (t.subtopics && t.subtopics.length) {
            const newSubs = t.subtopics.map((st) => {
              if (st.name.toLowerCase() === args.topic_name.toLowerCase()) { found = true; return { ...st, status: args.status }; }
              return st;
            });
            return { ...t, subtopics: newSubs };
          }
          return t;
        }));
        return found ? `*marca no guia* Beleza, atualizei "${args.topic_name}".` : `Não achei "${args.topic_name}" em ${args.subject_name} — quer que eu crie?`;
      }
      case "create_study_session": {
        setTab("cronometro");
        setTimeout(() => AgnesBus.emit({ name: "select_subject", args: { subject_name: args.subject_name } }), 80);
        return null;
      }
      case "finish_study_session":
        AgnesBus.emit({ name: "stop_timer", args: {} });
        return null;
      case "create_reminder":
        setGoals((prev) => [...prev, { id: uid(), title: args.title, targetDate: args.target_date, icon: "📌", color: accent }]);
        return `*anota no calendário* Prontinho, criei a meta "${args.title}".`;
      default:
        return null;
    }
  }

  async function send() {
    const text = inputText.trim();
    if (!text || sending) return;
    setInputText("");
    setMessages((prev) => [...prev, { role: "user", text }]);
    setSending(true);
    try {
      const res = await fetch(`${backendUrl.replace(/\/$/, "")}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, app_context: buildAppContext() }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => null);
        throw new Error((errBody && errBody.detail) || `Erro ${res.status}`);
      }
      const data = await res.json();
      setMessages((prev) => [...prev, { role: "agnes", text: data.reply }]);
      if (data.action) {
        const localReply = runLocalTool(data.action);
        if (localReply) setMessages((prev) => [...prev, { role: "agnes", text: localReply }]);
      }
      if (data.action_error) {
        setMessages((prev) => [...prev, { role: "agnes", text: `*coça a cabeça* Tentei fazer uma coisa mas deu ruim: ${data.action_error}` }]);
      }
    } catch (err) {
      const isNetworkFailure = err instanceof TypeError; // fetch não conseguiu nem completar a requisição
      const text = isNetworkFailure
        ? `*franze a testa* Não consegui alcançar ${backendUrl}. O backend está rodando? (veja backend/README.md)`
        : `*coça a cabeça* O backend respondeu com um erro: ${err.message}`;
      setMessages((prev) => [...prev, { role: "agnes", text }]);
    } finally {
      setSending(false);
    }
  }

  return (
    <React.Fragment>
      <button
        onClick={() => setOpen((v) => !v)}
        aria-label="Falar com a Agnes"
        style={{
          position: "fixed", bottom: 18, right: 18, width: 52, height: 52, borderRadius: "50%",
          background: "var(--accent)", color: "#14181C", border: "none", fontSize: 22,
          boxShadow: "0 4px 16px rgba(0,0,0,0.35)", cursor: "pointer", zIndex: 50,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}
      >
        {open ? "×" : "✨"}
      </button>

      {open && (
        <div style={{
          position: "fixed", bottom: 78, right: 18, width: "min(340px, calc(100vw - 36px))", maxHeight: "min(480px, calc(100vh - 140px))",
          background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 14, boxShadow: "0 8px 28px rgba(0,0,0,0.4)",
          display: "flex", flexDirection: "column", zIndex: 50, overflow: "hidden",
        }}>
          <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 16 }}>✨</span>
            <span style={{ fontSize: 13.5, fontWeight: 700, flex: 1 }}>Agnes</span>
            <button onClick={() => setShowSettings((v) => !v)} style={iconBtn} aria-label="Configurar backend">⚙</button>
          </div>

          {showSettings && (
            <div style={{ padding: 10, borderBottom: "1px solid var(--line)", background: "var(--surface2)" }}>
              <div style={{ fontSize: 11, color: "var(--muted)", marginBottom: 4 }}>Endereço do backend local</div>
              <input value={backendUrl} onChange={(e) => setBackendUrl(e.target.value)} style={{ ...input, width: "100%", fontSize: 12 }} />
            </div>
          )}

          <div ref={listRef} style={{ flex: 1, overflowY: "auto", padding: 12, display: "flex", flexDirection: "column", gap: 10 }}>
            {messages.map((m, i) => (
              <div key={i} style={{
                alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "85%",
                background: m.role === "user" ? "var(--accent)" : "var(--surface2)",
                color: m.role === "user" ? "#14181C" : "var(--text)",
                borderRadius: 12, padding: "8px 11px", fontSize: 13, lineHeight: 1.45,
              }}>
                {formatRP(m.text)}
              </div>
            ))}
            {sending && <div style={{ fontSize: 12, color: "var(--muted)" }}>*digitando...*</div>}
          </div>

          <div style={{ display: "flex", gap: 6, padding: 10, borderTop: "1px solid var(--line)" }}>
            <input
              value={inputText}
              onChange={(e) => setInputText(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && send()}
              placeholder="Fala com a Agnes..."
              style={{ ...input, flex: 1, fontSize: 13 }}
            />
            <button onClick={send} style={primaryBtn} disabled={sending || !inputText.trim()}>➤</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

// ---------- inline style tokens ----------
const input = { background: "var(--surface2)", border: "1px solid var(--line)", borderRadius: 6, color: "var(--text)", padding: "9px 9px", fontSize: 13.5, outline: "none" };
const primaryBtn = { background: "var(--accent)", color: "#14181C", border: "none", borderRadius: 6, padding: "9px 14px", fontSize: 13.5, fontWeight: 700, cursor: "pointer" };
const ghostBtn = { background: "transparent", color: "var(--text)", border: "1px solid var(--line)", borderRadius: 6, padding: "9px 14px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" };
const iconBtn = { background: "transparent", border: "none", color: "var(--muted)", fontSize: 18, cursor: "pointer", lineHeight: 1, padding: "0 4px", minHeight: "auto" };

ReactDOM.createRoot(document.getElementById("root")).render(<StudyApp />);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
